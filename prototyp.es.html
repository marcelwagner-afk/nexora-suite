<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Prototipo STEGARC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dunkle Navigationsleiste links, helle Arbeitsfläche mit weichen Karten; Startseite zweispaltig mit Assistent rechts; Telefon: Navigation als dunkle Leiste oben */
:root{
  --bg:#f7f6fc; --surface:#ffffff; --sunk:#f1effa; --line:#e7e4f2; --line-strong:#d3cfe6;
  --fg:#16142b; --fg-2:#4e4b66; --fg-3:#85829c;
  --accent:#6a45f0; --accent-2:#8b6cff; --accent-ink:#ffffff; --accent-soft:#efeafe; --accent-line:#cfc2fb;
  --nav-bg:#17153a; --nav-bg-2:#211d52; --nav-fg:#c9c6e6; --nav-fg-strong:#ffffff; --nav-on:#3a2f8f; --nav-line:#2c2860;
  --good:#16834a; --good-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fdf1dc; --crit:#c62a3a; --crit-soft:#fde6e8;
  --demo:#6a45f0; --demo-soft:#efeafe;
  --shadow:0 1px 2px rgba(35,28,90,.04),0 4px 16px rgba(35,28,90,.06);
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f22; --surface:#191733; --sunk:#221f42; --line:#2b2850; --line-strong:#3c3870;
  --fg:#ecebf8; --fg-2:#b4b1d0; --fg-3:#8784a8;
  --accent:#9b80ff; --accent-2:#b6a2ff; --accent-ink:#140f33; --accent-soft:#2a2358; --accent-line:#4b3fa0;
  --nav-bg:#0b0a1c; --nav-bg-2:#14123a; --nav-fg:#b6b3d8; --nav-fg-strong:#ffffff; --nav-on:#2f2775; --nav-line:#221f4a;
  --good:#5fd38f; --good-soft:#163527; --warn:#f0b05a; --warn-soft:#3a2c14; --crit:#ff8a94; --crit-soft:#3d1a22;
  --demo:#b6a2ff; --demo-soft:#2a2358; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100f22; --surface:#191733; --sunk:#221f42; --line:#2b2850; --line-strong:#3c3870;
  --fg:#ecebf8; --fg-2:#b4b1d0; --fg-3:#8784a8;
  --accent:#9b80ff; --accent-2:#b6a2ff; --accent-ink:#140f33; --accent-soft:#2a2358; --accent-line:#4b3fa0;
  --nav-bg:#0b0a1c; --nav-bg-2:#14123a; --nav-fg:#b6b3d8; --nav-fg-strong:#ffffff; --nav-on:#2f2775; --nav-line:#221f4a;
  --good:#5fd38f; --good-soft:#163527; --warn:#f0b05a; --warn-soft:#3a2c14; --crit:#ff8a94; --crit-soft:#3d1a22;
  --demo:#b6a2ff; --demo-soft:#2a2358; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav-bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:.92em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:26px;font-weight:800} h2{font-size:18px;font-weight:750} h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:700}
.ic{flex:none}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.app.with-ai{grid-template-columns:248px minmax(0,1fr) 380px}
.side{background:linear-gradient(180deg,var(--nav-bg) 0%,var(--nav-bg-2) 100%);color:var(--nav-fg);display:flex;flex-direction:column;gap:2px;padding:18px 12px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;color:var(--nav-fg-strong);text-decoration:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--nav-fg);font-weight:500}
.nav a,.nav button.nv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--nav-fg);text-decoration:none;font-weight:550;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.nav a:hover,.nav button.nv:hover{background:rgba(255,255,255,.06);color:var(--nav-fg-strong)}
.nav a.on{background:linear-gradient(90deg,var(--nav-on),rgba(106,69,240,.55));color:var(--nav-fg-strong)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--accent-2);color:#fff;border-radius:10px;padding:0 7px;font-weight:700}
.nav-sep{height:1px;background:var(--nav-line);margin:12px 10px}
.nav-label{padding:4px 14px 8px;font-size:12px;color:var(--nav-fg);font-weight:600}
.app-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.app-ic.m{background:linear-gradient(135deg,#7b5cff,#5434d6)} .app-ic.t{background:linear-gradient(135deg,#1f9c8b,#13685f)} .app-ic.i{background:linear-gradient(135deg,#9a5cf0,#5c2db8)}
.nav a.appl{padding:7px 10px;gap:12px;color:var(--nav-fg-strong)}
.tenant{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:none;background:rgba(255,255,255,.05);color:var(--nav-fg-strong);cursor:pointer;text-align:left;width:100%}
.tenant:hover{background:rgba(255,255,255,.09)}
.tenant .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.tenant small{display:block;color:var(--nav-fg);font-size:11.5px}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px) minmax(0,1fr);align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px}
.top .right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;padding:9px 14px;color:var(--fg-2);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0;width:100%}
.search .ic{color:var(--accent)}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--sunk);border-radius:6px;padding:2px 7px;color:var(--fg-2)}
.round{width:40px;height:40px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg);position:relative}
.round:hover{background:var(--sunk)}
.round .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.avatar{display:flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer;padding:2px;border-radius:24px;color:var(--fg)}
.avatar .face{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffb38a,#e0668f);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13.5px}
.avatar .face.u1{background:linear-gradient(135deg,#8b6cff,#4a2fd0)} .avatar .face.u2{background:linear-gradient(135deg,#3cc3a8,#1d7d6d)}
.page{padding:8px 24px 32px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px}

/* Elements */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(106,69,240,.25)}
:root[data-theme="dark"] .btn.pri{color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{color:var(--fg);border-color:var(--accent-line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;border-radius:8px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-neu{background:var(--sunk);color:var(--fg-2)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-demo{background:var(--demo-soft);color:var(--demo)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--fg-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar.acc i{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.sev{width:3px;align-self:stretch;border-radius:2px;flex:none}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px}
textarea.input{resize:vertical;min-height:72px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:20px;padding:3px 11px;font-size:12.5px;background:var(--surface)}
.chip.src{border-style:dashed;color:var(--fg-2)}
.note{border-radius:10px;padding:11px 13px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.demo{background:var(--demo-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft)} .note.crit{background:var(--crit-soft)} .note.good{background:var(--good-soft)} .note.acc{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 13px;border:none;background:none;cursor:pointer;color:var(--fg-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--fg-2);display:inline-flex;gap:8px;align-items:center}
.seg button b{font-size:11.5px;background:var(--sunk);border-radius:10px;padding:0 7px;font-weight:700}
.seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.seg button.on b{background:var(--surface)}

/* Startseite */
.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.home-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.home-side{display:flex;flex-direction:column;gap:18px;position:sticky;top:76px}
.hero{position:relative;padding:22px 2px 8px;display:flex;flex-direction:column;gap:16px;isolation:isolate}
.hero-wave{position:absolute;right:-8px;top:-56px;width:min(520px,70%);height:210px;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.01em}
.hero .sub{font-size:16px;color:var(--fg-2)}
.ask{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--accent-line);border-radius:16px;padding:7px 7px 7px 16px;align-items:center;box-shadow:0 6px 24px rgba(106,69,240,.10)}
.ask .ic{color:var(--accent)}
.ask input{flex:1;border:none;background:transparent;outline:none;padding:10px 0;min-width:0;font-size:15.5px}
.ask.big{max-width:880px;width:100%;align-self:center}
.send{width:48px;height:38px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.quick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.quick button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 15px;cursor:pointer;font-weight:550;box-shadow:var(--shadow);color:var(--fg)}
.quick button .ic{color:var(--accent)}
.quick button:hover{border-color:var(--accent-line)}
.sugg{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg-2)}
.sugg:hover{border-color:var(--accent);color:var(--fg)}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat{position:relative;min-height:84px}.stat > .ic{color:var(--accent)}
.stat .d{position:absolute;top:12px;right:14px}
.stat .v{font-family:var(--f-display);font-size:21px;font-weight:800;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--fg-2)}
.stat .d{font-size:12px;font-weight:700;white-space:nowrap}
.promo{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,220px);gap:22px;align-items:center;padding:18px 22px;background:linear-gradient(120deg,var(--accent-soft) 0%,var(--surface) 48%)}
.promo .art{display:grid;place-items:center}
.promo h2{font-size:22px;font-weight:800}
.promo .kick{font-size:13px;font-weight:700;color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:9px;border-left:1px solid var(--line);padding-left:20px}
.checks span{display:flex;gap:10px;align-items:center;font-size:13.5px}
.checks .ic{color:var(--good)}
.ms{display:flex;gap:10px;align-items:center}
.ms .ic{color:var(--fg-3)}
.dots{border:none;background:none;cursor:pointer;color:var(--fg-3);padding:4px 6px;border-radius:6px}
.dots:hover{background:var(--sunk);color:var(--fg)}
.proj-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.aic{padding:18px;display:flex;flex-direction:column;gap:14px}
.aic-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aic-h h2{display:flex;gap:10px;align-items:center}
.aic-h h2 .ic{color:var(--accent)}
.model{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:600}
.aic .hi{font-family:var(--f-display);font-size:21px;font-weight:800}
.qcard{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;box-shadow:var(--shadow);color:var(--fg);width:100%}
.qcard .ic{color:var(--accent)}
.qcard:hover{border-color:var(--accent-line)}
.composer{border:1px solid var(--line-strong);border-radius:12px;padding:10px 10px 8px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer input{border:none;outline:none;background:transparent;padding:4px 2px;font-style:italic}
.composer .tools{display:flex;align-items:center;gap:4px}
.composer .tools .tb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.composer .send{margin-left:auto;width:38px;height:34px;border-radius:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:650;color:var(--fg)}
.tile .ic{color:var(--fg)}
.tile:hover,.tile.on{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.on .ic{color:var(--accent)}
.home-chat{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow:auto}

/* Wizard */
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:104px;display:flex;flex-direction:column;gap:6px;padding:0 6px 0 0;cursor:pointer;background:none;border:none;text-align:left}
.step .ln{height:5px;border-radius:3px;background:var(--line)}
.step.done .ln{background:var(--accent)} .step.cur .ln{background:var(--accent-2);opacity:.6}
.step .t{font-size:12px;color:var(--fg-3);font-weight:600}
.step.cur .t,.step.done .t{color:var(--fg)}
.step[disabled]{cursor:default}
.what{font-size:13px;color:var(--fg-2);background:var(--accent-soft);border-radius:10px;padding:9px 13px}
.map-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
.srcf{display:flex;flex-direction:column;gap:6px}
.srcf .chip{cursor:grab;justify-content:space-between;border-radius:8px}
.maprow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.maprow.drop{background:var(--accent-soft)}
.maprow.sugg-row .input{border-style:dashed;border-color:var(--accent-line)}
.maprow:last-child{border-bottom:none}
.why{font-size:12px;color:var(--fg-3)}
.prog{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .15s}

/* Gantt */
.gantt{display:flex;flex-direction:column;gap:0;min-width:640px}
.g-row{display:grid;grid-template-columns:220px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line)}
.g-track{position:relative;height:20px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--line) calc(10% - 1px),var(--line) 10%)}

 const acts=S.cut.acts, res={};
 const durOf=a=>a.dur+(a.id==="c4"?S.cut.delay:0);
 acts.forEach(a=>{const st=Math.max(0,...a.deps.map(d=>res[d].end));res[a.id]={st,end:st+durOf(a),dur:durOf(a)}});
 const total=Math.max(...acts.map(a=>res[a.id].end));
 const crit=new Set();let cur=acts.find(a=>res[a.id].end===total);
 while(cur){crit.add(cur.id);if(!cur.deps.length)break;const st=res[cur.id].st;cur=acts.find(a=>cur.deps.includes(a.id)&&res[a.id].end===st)}
 return{res,total,crit,buffer:S.cut.window-total};
}

const WSTEPS=["Intención","Conexiones","Objetos","Análisis","Mapeo","Prueba","Validación","Aprobación"];
function wizCanReach(w,i){
 if(i<=1)return true;
 if(i>=2&&!w.parsed)return false;
 if(i>=3&&!(w.conn.src==="ok"&&w.conn.tgt==="ok"))return false;
 if(i>=4&&!Object.values(w.objs).some(Boolean))return false;
 if(i>=5&&!w.analyzed)return false;
 if(i>=6&&covOf(w)<100)return false;
 if(i>=7&&w.test.state!=="done")return false;
 if(i>=8&&!w.val)return false;
 return true;
}

/* ============ Prozesse ============ */
function bpmnSvg(all,hl){
 const steps=all.filter(s=>!s.offline),hasGw=steps.some(s=>s.kind==="gw");
 const W=150,G=40,H=56,y0=60,HT=hasGw?220:140;let x=24;const pos=[];
 steps.forEach(s=>{const w=s.kind==="start"||s.kind==="end"?36:s.kind==="gw"?56:W;pos.push({s,x,w});x+=w+G});
 const width=x-G+64;
 let out=`<svg width="${width}" height="${HT}" viewBox="0 0 ${width} ${HT}" role="img" aria-label="Modelo de proceso Purchase-to-Pay"><defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--fg-3)"/></marker></defs>`;
 pos.forEach((p,i)=>{const cy=y0+H/2,isHl=hl&&hl.includes(p.s.id),stroke=isHl?"var(--accent)":"var(--fg-3)",sw=isHl?2:1.25,fill=isHl?"var(--accent-soft)":"var(--surface)";
  if(i<pos.length-1){out+=`<line x1="${p.x+p.w}" y1="${cy}" x2="${pos[i+1].x-2}" y2="${cy}" stroke="var(--fg-3)" stroke-width="1.25" marker-end="url(#pa)"/>`}
  if(p.s.kind==="start"||p.s.kind==="end"){out+=`<circle cx="${p.x+18}" cy="${cy}" r="18" fill="${fill}" stroke="${stroke}" stroke-width="${p.s.kind==="end"?3:sw}"/><text x="${p.x+18}" y="${cy+36}" text-anchor="middle" font-size="11.5" fill="var(--fg-2)">${esc(p.s.name)}</text>`}
  else if(p.s.kind==="gw"){out+=`<polygon points="${p.x+28},${cy-28} ${p.x+56},${cy} ${p.x+28},${cy+28} ${p.x},${cy}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text x="${p.x+28}" y="${cy+5}" text-anchor="middle" font-size="16" fill="var(--fg)">×</text><text x="${p.x+28}" y="${cy-36}" text-anchor="middle" font-size="11.5" fill="var(--fg-2)">${esc(p.s.name)}</text><text x="${p.x+60}" y="${cy-6}" font-size="11" fill="var(--fg-2)">nein</text>`;
   const ex=all.find(z=>z.id===p.s.branch),nx=pos[i+1].x;if(ex){out+=`<path d="M${p.x+28} ${cy+28}V${cy+92}H${nx-2}" fill="none" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#pa)"/><text x="${p.x+34}" y="${cy+52}" font-size="11" fill="var(--fg-2)">ja</text><rect x="${nx}" y="${cy+70}" width="${W}" height="44" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text x="${nx+W/2}" y="${cy+96}" text-anchor="middle" font-size="12.5" fill="var(--fg)">${esc(ex.name)}</text><path d="M${nx+W/2} ${cy+70}V${cy+H/2+2}" fill="none" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#pa)"/>`}}
  else{out+=`<rect x="${p.x}" y="${y0}" width="${p.w}" height="${H}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text x="${p.x+p.w/2}" y="${cy+4}" text-anchor="middle" font-size="12.5" fill="var(--fg)">${esc(p.s.name)}</text>`}
 });
 return out+"</svg>";
}

/* ============ Analysen ============ */
function forecast(){
 const t=REV.map((_,i)=>i+1),N=t.length,mt=t.reduce((a,b)=>a+b)/N,my=REV.reduce((a,b)=>a+b)/N;
 const b=t.reduce((a,ti,i)=>a+(ti-mt)*(REV[i]-my),0)/t.reduce((a,ti)=>a+(ti-mt)**2,0),a=my-b*mt;
 const g=1+S.an.growth/100;
 const fc=Array.from({length:12},(_,i)=>Math.round((a+b*(13+i))*g));
 return{a,b,fc,sum:fc.reduce((x,y)=>x+y,0),base:REV.reduce((x,y)=>x+y,0)};
}
function viewAnalytics(){
 const f=forecast(),all=REV.concat(f.fc),mx=Math.ceil(Math.max(...all)/100)*100+50,mn=Math.floor(Math.min(...all)/100)*100-50;
 const W=720,H=260,L=48,R=16,T=16,B=32,X=i=>L+i*(W-L-R)/23,Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
 const ticks=[];for(let v=Math.ceil(mn/100)*100;v<=mx;v+=100)ticks.push(v);
 const pathA=REV.map((v,i)=>`${i?"L":"M"}${X(i)} ${Y(v)}`).join(""),pathF=[REV[11]].concat(f.fc).map((v,i)=>`${i?"L":"M"}${X(11+i)} ${Y(v)}`).join("");
 return`<div class="page-head"><div><p class="eyebrow">Analytics & Planning · fase de ampliación</p><h1>Forecast de ventas 2027</h1></div></div>
 <div class="grid g3">
  <div class="card kpi"><span class="eyebrow">Real 2026</span><span class="v">${n(f.base)} T€</span></div>
  <div class="card kpi"><span class="eyebrow">Forecast 2027</span><span class="v">${n(f.sum)} T€</span><span class="small muted">${f.sum>=f.base?"+":""}${pct(f.sum-f.base,f.base)} % frente a 2026</span></div>
  <div class="card kpi"><span class="eyebrow">Escenario</span><span class="v">${S.an.growth>0?"+":""}${S.an.growth} %</span><span class="small muted">Recargo sobre la tendencia</span></div>
 </div>
 <section class="card card-pad" style="display:flex;flex-direction:column;gap:12px">
  <div class="row between"><h3>Ventas mensuales en miles de € · real 2026 y forecast 2027</h3><div class="row small"><label for="growth">Escenario</label><input type="range" id="growth" min="-10" max="10" step="1" value="${S.an.growth}" data-on="growth" style="accent-color:var(--accent)"></div></div>
  <div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="Evolución de ventas 2026 y forecast 2027">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--fg-3)" font-family="var(--f-mono)">${v}</text>`).join("")}
   ${[0,3,6,9,12,15,18,21].map(i=>`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--fg-3)">${MONTHS[i%12]} ${i<12?"26":"27"}</text>`).join("")}
   <line x1="${X(11.5)}" x2="${X(11.5)}" y1="${T}" y2="${H-B}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
   <path d="${pathA}L${X(11)} ${H-B}L${X(0)} ${H-B}Z" fill="var(--accent)" fill-opacity=".08"/>
   <path d="${pathA}" fill="none" stroke="var(--accent)" stroke-width="2"/>
   <path d="${pathF}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
   <circle cx="${X(23)}" cy="${Y(f.fc[11])}" r="4" fill="var(--accent)"/><text x="${X(23)-6}" y="${Y(f.fc[11])-10}" text-anchor="end" font-size="12" fill="var(--fg)" font-family="var(--f-mono)">${n(f.fc[11])}</text>
  </svg></div>
  <div class="note acc small"><div><b>Método de cálculo (determinista):</b> regresión lineal sobre 12 meses, <span class="mono">Ventas(t) = ${f.a.toFixed(1).replace(".",",")} + ${f.b.toFixed(2).replace(".",",")} · t</span>, escenario como factor ${(1+S.an.growth/100).toFixed(2).replace(".",",")}. La IA solo propone el modelo; el cálculo se realiza en el motor de cálculo.</div></div>
 </section>
 <section class="card tbl-wrap"><table><thead><tr><th>Mes 2027</th>${MONTHS.map(m=>`<th class="r">${m}</th>`).join("")}</tr></thead><tbody><tr><td>Forecast miles de €</td>${f.fc.map(v=>`<td class="r num">${n(v)}</td>`).join("")}</tr></tbody></table></section>`;
}

function answer(q){
 const t=q.toLowerCase();
 if(/migrier|migration.*(nach|von)|aus .* nach/.test(t)&&/(dynamics|salesforce|ecc|hubspot|csv)/.test(t)&&!/warum|fortschritt|fehlen/.test(t)){
  S.wiz=newWiz(q);S.ai=S.ai;setTimeout(()=>go("migration"),0);
  return`<p>He abierto el asistente de migración con su descripción. Confirme en el primer paso el origen, el destino y el objeto.</p>`+src(["Catálogo de conectores (motor de pruebas)"])}
 if(/warum|2\.?400|materialst/.test(t)){const j=S.jobs.find(x=>x.err&&t.includes(x.name.toLowerCase()))||S.jobs[0];
  return`<p><b>${n(j.err)} registros ${esc(j.name)}</b> han fallado en ${j.run}. ${j.errGroups.length===1?"Explicada una causa":j.errGroups.length+" Explicar causas"} todos los errores:</p><table><tbody>${j.errGroups.map(g=>`<tr><td>${esc(g[0])}</td><td class="r num">${n(g[1])}</td></tr>`).join("")}</tbody></table>${j.id==="j1"?`<p>Recomendación: completar primero la tabla de valores de unidades de medida (resuelve el ${pct(1380,2400)} %). La asignación de la planta 1200 requiere una decisión funcional.</p>`:`<p>Recomendación: ${esc(j.errGroups[0][2])}.</p>`}`+src(["Registro de errores "+j.name+" · "+j.run])+`<div class="row"><button class="btn sm" data-act="ask" data-q="Welche Mappings fehlen noch für die nächste Testmigration?">Mostrar mapeos pendientes</button></div>`}
 if(/mapping|fehlen/.test(t)){const rows=S.jobs.flatMap(j=>j.missing.map(m=>[j.name,...m]));const w=S.wiz;const wm=w?w.map.filter(m=>m.req&&m.state!=="ok").map(m=>["Clientes (asistente)",m.label,"no confirmado"]):[];
  return`<p>Para la próxima migración de prueba faltan <b>${rows.length+wm.length}</b> asignaciones, priorizadas según los registros afectados:</p><table><thead><tr><th>Objeto</th><th>Campo</th><th>Estado</th></tr></thead><tbody>${rows.concat(wm).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join("")}</tbody></table>`+src(["Cobertura de mapeo de todos los objetos de migración"])}
 if(/go-?live|risik|gefährd/.test(t)){const c=cutCalc();const crit=S.defects.filter(d=>d.sev==="kritisch"&&d.status!=="behoben").length;const failed=S.tests.filter(x=>x.status==="fehlgeschlagen").length;
  const rows=[["Migración de datos",S.jobs.some(j=>j.health==="crit")?"crit":"good","Maestro de materiales 2.400 errores (5 %)"],["Pruebas",crit?"crit":failed?"warn":"good",`${failed} fallidos, ${crit} error crítico pendiente`],["Cutover",c.buffer<0?"crit":c.buffer<3?"warn":"good",`Margen de ${c.buffer} h en una ventana de ${S.cut.window} h`],["Decisiones","warn","Clases de valoración pendientes hasta el comité de dirección del 26.11."],["Recursos","warn","Key user de compras al 50 % en diciembre"]];
  return`<p>Disposición para el go-live <b>Conversión a S/4HANA – Planta Sur</b> (01.03.2027):</p><table><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${pill(hCls[r[1]],r[1]==="crit"?"kritisch":r[1]==="warn"?"beobachten":"ok")}</td><td class="small">${esc(r[2])}</td></tr>`).join("")}</tbody></table><p>Mayor palanca: corregir el error D-21 (unidades de medida). Bloquea el caso de prueba TC-202 y explica 1.380 errores de migración.</p><p class="small faint">Incertidumbre: el riesgo de recursos se basa en una estimación de la planificación de recursos.</p>`+src(["Proyecto Planta Sur","Casos de prueba y errores","Plan de cutover","Ejecuciones de migración"])}
 if(/steering|bericht|lenkungs|statusreport|projektstatus/.test(t)){const c=cutCalc();const p=S.projects[0];
  return`<p><b>Borrador del informe de estado para el comité de dirección · ${new Date().toLocaleDateString("es-ES")}</b></p><p><b>Estado general:</b> Amarillo. Progreso ${p.progress} %, presupuesto consumido al ${pct(p.spent,p.budget)} %.</p><p><b>Logrado:</b> Blueprint aceptado; proveedores con un 99,8 % de éxito en la migración de prueba 3.</p><p><b>Crítico:</b> Maestro de materiales 2.400 errores; margen de cutover ${c.buffer} h.</p><p><b>Decisión solicitada:</b> Redefinir las clases de valoración o adoptarlas 1:1.</p><p><b>Próximos hitos:</b> Prueba de integración 1 (20.11.), migración de prueba 4 (11.12.).</p>`+src(["Proyecto Planta Sur","Migraciones","Plan de cutover","Registro de decisiones"])+`<div class="row"><button class="btn sm" data-act="copyReport">Copiar texto</button></div>`}
 if(/fortschritt|analysier.*migration|migrationsfortschritt/.test(t)){const tot=S.jobs.reduce((a,j)=>a+j.total,0),ok=S.jobs.reduce((a,j)=>a+j.ok,0);
  return`<p>En todos los objetos se han cargado correctamente <b>${n(ok)} von ${n(tot)}</b> registros (${pct(ok,tot)} %) en las ejecuciones de prueba.</p><table><tbody>${S.jobs.map(j=>`<tr><td>${esc(j.name)}</td><td>${pill(hCls[j.health],j.status)}</td><td class="r num">${j.cov} %</td></tr>`).join("")}</tbody></table><p>Los activos fijos son el próximo cuello de botella: 64 % de cobertura de mapeo y aún sin ejecución de prueba.</p>`+src(["Ejecuciones de migración","Cobertura de mapeo"])}
 if(/testf|testfälle/.test(t)){setTimeout(()=>ACT.genTests(),0);return`<p>Derivo casos de prueba del proceso Purchase-to-Pay y abro la gestión de pruebas. Cada borrador se marca como «Borrador de IA» hasta que alguien lo adopte.</p>`+src(["Modelo de proceso P2P, versión "+S.proc.version,"Casos de prueba existentes"])}
 if(false){setTimeout(()=>{S.testTab="faelle";go("tests")},0);return`<p>Abro la gestión de pruebas. Allí puede derivar casos de prueba del proceso P2P; cada borrador se marca como «Borrador de IA» hasta que alguien lo adopte.</p>`}
 if(/projekt.*(erstell|anleg|neu)|neues transformationsprojekt/.test(t)){setTimeout(()=>ACT.newProject(),0);return`<p>He abierto el formulario para un nuevo proyecto.</p>`}
 if(/cutover|sechs stunden|6 stunden|länger dauert/.test(t)){setTimeout(()=>{S.cut.delay=6;go("cutover")},0);return`<p>Abro el plan de cutover y fijo el retraso de la migración de datos de movimientos en +6 h. Resultado: la ventana se supera en ${(()=>{const d=S.cut.delay;S.cut.delay=6;const c=cutCalc();S.cut.delay=d;return -c.buffer})()} h.</p>`+src(["Plan de cutover, 11 actividades, dependencias"])}
 return`<p>Para esto no tengo un análisis adecuado en esta demo. Puedo evaluar riesgos del go-live, explicar errores de migración, listar mapeos pendientes, redactar un informe para el comité de dirección, simular retrasos del cutover o iniciar una nueva migración.</p>`;
}
function ask(q){if(!q.trim())return;S.chat.push({u:q});S.chat.push({a:answer(q)});if(!["assistent","start"].includes(route()))S.ai=true;audit("Consulta al asistente: "+q.slice(0,60));render()}

 groupDefects(){S.defGrouped=!S.defGrouped;render()},
 gng(d){const u=me();if(!u.canApprove)return;S.cut.decision=d.v;audit("Decisión go/no-go: "+d.v);toast("Decisión «"+d.v+"» registrada");render()},
 procAccept(){const P=S.proc;P.steps=P.proposal.steps;P.version++;P.history.unshift(["v"+P.version,P.proposal.diff.join(", "),new Date().toLocaleDateString("es-ES")]);P.proposal=null;audit("Proceso P2P versión "+P.version+" traspasado");render()},
 procReject(){S.proc.proposal=null;render()},
 procTests(){ACT.genTests()},
 setTab(d){S.setTab=d.t;render()},
 copyReport(_,el){const txt=el.closest(".msg").innerText.replace(/Text kopieren$/,"").trim();const done=()=>toast("Informe copiado");try{navigator.clipboard.writeText(txt).then(done,()=>toast("No se puede copiar. Seleccione el texto."))}catch(e){toast("No se puede copiar. Seleccione el texto.")}}
};
const ON={
 user(v){S.user=+v;audit("Usuario cambiado (demo) a "+me().name);render()},
 wizIntent(v){S.wiz.intent=v;S.wiz.parsed=null},
 wizSrc(v){S.wiz.src=v;S.wiz.conn.src=null;render()},
 wizTgt(v){S.wiz.tgt=v;S.wiz.conn.tgt=null;render()},
 wizObj(v,el){S.wiz.objs[el.dataset.o]=el.checked;render()},
 dedupe(v,el){S.wiz.dedupe=el.checked;if(S.wiz.test.state==="done"){S.wiz.test={state:"idle",pct:0,res:null};S.wiz.val=null}render()},
 vatWarn(v,el){S.wiz.vatWarn=el.checked;if(S.wiz.test.state==="done"){S.wiz.test={state:"idle",pct:0,res:null};S.wiz.val=null}render()},
 mapSel(v,el){const m=S.wiz.map[+el.dataset.i];m.src=v||null;m.state=v?"ok":"open";m.by=me().name;render()},
 testStatus(v,el){const t=S.tests[+el.dataset.i];t.status=v;t.gen=false;audit("Caso de prueba "+t.id+" a «"+v+"» establecido");render()},
 delay(v){S.cut.delay=+v;render()},
 growth(v){S.an.growth=+v;render()}
};
const FORMS={
 login(){ACT.login()},
 ask(){ask($("#askIn").value)},
 chat(){ask($("#chatIn").value)},
 homeChat(){ask($("#homeChatIn").value)},
 newProject(){const name=$("#npName").value.trim();if(!name)return;const id="p"+(S.projects.length+1);const g=$("#npGo").value;S.projects.push({id,name,product:$("#npProd").value,phase:"Planificación",golive:g?g.split("-").reverse().join("."):"offen",health:"neu",budget:0,spent:0,progress:0,milestones:[],risks:[],decisions:[]});S.projSel=id;S.modal=null;audit("Proyecto creado: "+name);renderLayer();toast("Proyecto creado");go("projekte")},
 addRisk(){const t=$("#rkText").value.trim();if(!t)return;S.projects.find(p=>p.id===S.projSel).risks.unshift([t,$("#rkSev").value,"manuell erfasst"]);S.modal=null;audit("Riesgo registrado: "+t);renderLayer();render()},
 proc(){const t=$("#procIn").value.toLowerCase();const P=S.proc;
  const m=t.match(/(\d{1,3}(?:[.\s]?\d{3})*)\s*(?:€|euro|eur)/);
  if(/freigabe|genehmig/.test(t)){const amt=m?m[1].replace(/\s/g,""):"50.000";const steps=P.steps.slice();const at=steps.findIndex(s=>s.name==="Crear pedido de compra");
   if(steps.some(s=>s.kind==="gw")){toast("El modelo ya contiene una aprobación.");return}
   steps.splice(at+1,0,{id:"g1",kind:"gw",name:"Valor > "+amt+" €?",branch:"x1"},{id:"x1",kind:"task",name:"Aprobación de la dirección de compras",offline:true});
   P.proposal={steps,hl:["g1","x1"],diff:["+ Gateway «Valor > "+amt+" €?» después de «Crear pedido de compra»","+ Tarea «Aprobación de la dirección de compras» en la ruta Sí","Ruta No directamente a la entrada de mercancías"]};audit("Propuesta de proceso creada: aprobación por encima de "+amt+" €");render()}
  else toast("La demo no reconoce este cambio. Pruebe: aprobación para pedidos de compra superiores a 50.000 euros.")}
};

/* ============ Palette ============ */
function openPalette(){
 const items=[["Inicio","go:start"],["Proyectos","go:projekte"],["Migraciones","go:migration"],["Iniciar nueva migración","act:newMig"],["Pruebas","go:tests"],["Plan de cutover","go:cutover"],["Procesos","go:prozesse"],["Análisis","go:analytics"],["Aprobaciones","go:freigaben"],["Configuración","go:einstellungen"],["Crear nuevo proyecto","act:newProject"],["Analizar riesgos del go-live","ask:Muéstrame los riesgos críticos del go-live"],["Redactar informe para el comité de dirección","ask:Prepara el próximo informe para el Steering Committee"]];
 S.pal={q:"",items};
 S.modal=()=>{const q=S.pal.q.toLowerCase(),f=S.pal.items.filter(i=>i[0].toLowerCase().includes(q));
  return`<div style="padding:10px;border-bottom:1px solid var(--line)"><input class="input" id="palIn" autofocus placeholder="Página, acción o pregunta" value="${esc(S.pal.q)}" data-on="pal" aria-label="Buscar"></div><div>${f.map(i=>`<button class="pal-item" data-act="palRun" data-v="${esc(i[1])}">${ic(i[1].startsWith("ask")?"ai":"search")}${esc(i[0])}</button>`).join("")}${q&&!f.length?`<button class="pal-item" data-act="palRun" data-v="ask:${esc(S.pal.q)}">${ic("ai")}Preguntar al asistente: «${esc(S.pal.q)}»</button>`:""}</div>`};
 renderLayer();
}
ACT.palRun=d=>{const[k,...r]=d.v.split(":"),v=r.join(":");S.modal=null;renderLayer();if(k==="go")go(v);else if(k==="act")ACT[v]();else ask(v)};
ON.pal=v=>{S.pal.q=v;const pos=v.length;renderLayer();const el=$("#palIn");if(el){el.focus();el.setSelectionRange(pos,pos)}};

/* ============ Events ============ */
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a||a.disabled)return;if(a.tagName==="A")return;e.preventDefault();const f=ACT[a.dataset.act];if(f)f(a.dataset,a)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-on]");if(!el||el.dataset.on==="wizIntent"||el.dataset.on==="pal")return;ON[el.dataset.on]&&ON[el.dataset.on](el.value,el)});
document.addEventListener("input",e=>{const el=e.target.closest("[data-on]");if(!el)return;const k=el.dataset.on;if(k==="wizIntent"||k==="pal")ON[k](el.value,el);else if(k==="delay"){const b=el.nextElementSibling;if(b)b.textContent="+"+el.value+" h"}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();FORMS[f.dataset.form]&&FORMS[f.dataset.form]()});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"&&S.logged){e.preventDefault();openPalette()}if(e.key==="Escape"&&(S.modal||S.menu)){S.modal=null;S.menu=false;renderLayer()}});
document.addEventListener("dragstart",e=>{const c=e.target.closest("[data-drag]");if(c){e.dataTransfer.setData("text/plain",c.dataset.drag)}});
document.addEventListener("dragover",e=>{const r=e.target.closest("[data-drop]");if(r){e.preventDefault();r.classList.add("drop")}});
document.addEventListener("dragleave",e=>{const r=e.target.closest("[data-drop]");if(r)r.classList.remove("drop")});
document.addEventListener("drop",e=>{const r=e.target.closest("[data-drop]");if(!r)return;e.preventDefault();const f=e.dataTransfer.getData("text/plain");const m=S.wiz.map[+r.dataset.drop];m.src=f;m.state="ok";m.by=me().name;render()});
window.addEventListener("hashchange",()=>{render();const m=$(".main");if(m)m.scrollTop=0});
function afterRender(rt){
 if(rt==="migration"||rt==="assistent"||S.ai){const b=$("#aiBody");if(b)b.scrollTop=b.scrollHeight}
 if(rt==="migration"&&S.wiz&&S.wiz.step===5){}
 if(S.focus){const el=document.getElementById(S.focus);if(el){el.focus();if(el.setSelectionRange){const l=el.value.length;el.setSelectionRange(l,l)}}S.focus=null}
}
const VIEWS={start:viewStart,projekte:viewProjekte,migration:viewMigration,tests:viewTests,cutover:viewCutover,prozesse:viewProzesse,analytics:viewAnalytics,freigaben:viewFreigaben,assistent:viewAssistent,einstellungen:viewEinstellungen};
/* Range-Schieber: Fokus nach Neuaufbau halten */
const _delay=ON.delay,_growth=ON.growth;ON.delay=v=>{S.focus="delay";_delay(v)};ON.growth=v=>{S.focus="growth";_growth(v)};
render();
</script>
