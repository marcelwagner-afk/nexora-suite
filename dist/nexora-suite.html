<title>NEXORA AI Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dunkle Navigationsleiste links, helle Arbeitsfläche mit weichen Karten; Startseite zweispaltig mit Assistent rechts; Telefon: Navigation als dunkle Leiste oben */
:root{
  --bg:#f7f6fc; --surface:#ffffff; --sunk:#f1effa; --line:#e7e4f2; --line-strong:#d3cfe6;
  --fg:#16142b; --fg-2:#4e4b66; --fg-3:#85829c;
  --accent:#6a45f0; --accent-2:#8b6cff; --accent-ink:#ffffff; --accent-soft:#efeafe; --accent-line:#cfc2fb;
  --nav-bg:#17153a; --nav-bg-2:#211d52; --nav-fg:#c9c6e6; --nav-fg-strong:#ffffff; --nav-on:#3a2f8f; --nav-line:#2c2860;
  --good:#16834a; --good-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fdf1dc; --crit:#c62a3a; --crit-soft:#fde6e8;
  /* Marktposition: Kategorien und Bewertungen */ --cat-suite:#3f62c8; --cat-work:#0d7f74; --cat-ai:#b25f0c; --rate-good:#16834a; --rate-mid:#b07a12; --rate-weak:#a3a0b8; --quad:#f1eefb;
  --demo:#6a45f0; --demo-soft:#efeafe;
  --shadow:0 1px 2px rgba(35,28,90,.04),0 4px 16px rgba(35,28,90,.06);
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f22; --surface:#191733; --sunk:#221f42; --line:#2b2850; --line-strong:#3c3870;
  --fg:#ecebf8; --fg-2:#b4b1d0; --fg-3:#8784a8;
  --accent:#9b80ff; --accent-2:#b6a2ff; --accent-ink:#140f33; --accent-soft:#2a2358; --accent-line:#4b3fa0;
  --nav-bg:#0b0a1c; --nav-bg-2:#14123a; --nav-fg:#b6b3d8; --nav-fg-strong:#ffffff; --nav-on:#2f2775; --nav-line:#221f4a;
  --good:#5fd38f; --good-soft:#163527; --warn:#f0b05a; --warn-soft:#3a2c14; --crit:#ff8a94; --crit-soft:#3d1a22;
  --cat-suite:#86a3ff; --cat-work:#4fd1c0; --cat-ai:#f0a54a; --rate-good:#5fd38f; --rate-mid:#e8b44c; --rate-weak:#5d5a80; --quad:#1b1944;
  --demo:#b6a2ff; --demo-soft:#2a2358; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100f22; --surface:#191733; --sunk:#221f42; --line:#2b2850; --line-strong:#3c3870;
  --fg:#ecebf8; --fg-2:#b4b1d0; --fg-3:#8784a8;
  --accent:#9b80ff; --accent-2:#b6a2ff; --accent-ink:#140f33; --accent-soft:#2a2358; --accent-line:#4b3fa0;
  --nav-bg:#0b0a1c; --nav-bg-2:#14123a; --nav-fg:#b6b3d8; --nav-fg-strong:#ffffff; --nav-on:#2f2775; --nav-line:#221f4a;
  --good:#5fd38f; --good-soft:#163527; --warn:#f0b05a; --warn-soft:#3a2c14; --crit:#ff8a94; --crit-soft:#3d1a22;
  --cat-suite:#86a3ff; --cat-work:#4fd1c0; --cat-ai:#f0a54a; --rate-good:#5fd38f; --rate-mid:#e8b44c; --rate-weak:#5d5a80; --quad:#1b1944;
  --demo:#b6a2ff; --demo-soft:#2a2358; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav-bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:.92em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:26px;font-weight:800} h2{font-size:18px;font-weight:750} h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:700}
.ic{flex:none}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.app.with-ai{grid-template-columns:248px minmax(0,1fr) 380px}
.side{background:linear-gradient(180deg,var(--nav-bg) 0%,var(--nav-bg-2) 100%);color:var(--nav-fg);display:flex;flex-direction:column;gap:2px;padding:18px 12px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;color:var(--nav-fg-strong);text-decoration:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--nav-fg);font-weight:500}
.nav a,.nav button.nv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--nav-fg);text-decoration:none;font-weight:550;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.nav a:hover,.nav button.nv:hover{background:rgba(255,255,255,.06);color:var(--nav-fg-strong)}
.nav a.on{background:linear-gradient(90deg,var(--nav-on),rgba(106,69,240,.55));color:var(--nav-fg-strong)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--accent-2);color:#fff;border-radius:10px;padding:0 7px;font-weight:700}
.nav-sep{height:1px;background:var(--nav-line);margin:12px 10px}
.nav-label{padding:4px 14px 8px;font-size:12px;color:var(--nav-fg);font-weight:600}
.app-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.app-ic.m{background:linear-gradient(135deg,#7b5cff,#5434d6)} .app-ic.t{background:linear-gradient(135deg,#1f9c8b,#13685f)} .app-ic.i{background:linear-gradient(135deg,#9a5cf0,#5c2db8)}
.nav a.appl{padding:7px 10px;gap:12px;color:var(--nav-fg-strong)}
.tenant{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:none;background:rgba(255,255,255,.05);color:var(--nav-fg-strong);cursor:pointer;text-align:left;width:100%}
.tenant:hover{background:rgba(255,255,255,.09)}
.tenant .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.tenant small{display:block;color:var(--nav-fg);font-size:11.5px}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px) minmax(0,1fr);align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px}
.top .right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;padding:9px 14px;color:var(--fg-2);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0;width:100%}
.search .ic{color:var(--accent)}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--sunk);border-radius:6px;padding:2px 7px;color:var(--fg-2)}
.round{width:40px;height:40px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg);position:relative}
.round:hover{background:var(--sunk)}
.round .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.avatar{display:flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer;padding:2px;border-radius:24px;color:var(--fg)}
.avatar .face{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffb38a,#e0668f);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13.5px}
.avatar .face.u1{background:linear-gradient(135deg,#8b6cff,#4a2fd0)} .avatar .face.u2{background:linear-gradient(135deg,#3cc3a8,#1d7d6d)}
.page{padding:8px 24px 32px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px}

/* Elements */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(106,69,240,.25)}
:root[data-theme="dark"] .btn.pri{color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{color:var(--fg);border-color:var(--accent-line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;border-radius:8px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-neu{background:var(--sunk);color:var(--fg-2)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-demo{background:var(--demo-soft);color:var(--demo)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--fg-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar.acc i{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.sev{width:3px;align-self:stretch;border-radius:2px;flex:none}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px}
textarea.input{resize:vertical;min-height:72px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:20px;padding:3px 11px;font-size:12.5px;background:var(--surface)}
.chip.src{border-style:dashed;color:var(--fg-2)}
.note{border-radius:10px;padding:11px 13px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.demo{background:var(--demo-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft)} .note.crit{background:var(--crit-soft)} .note.good{background:var(--good-soft)} .note.acc{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 13px;border:none;background:none;cursor:pointer;color:var(--fg-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--fg-2);display:inline-flex;gap:8px;align-items:center}
.seg button b{font-size:11.5px;background:var(--sunk);border-radius:10px;padding:0 7px;font-weight:700}
.seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.seg button.on b{background:var(--surface)}

/* Startseite */
.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.home-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.home-side{display:flex;flex-direction:column;gap:18px;position:sticky;top:76px}
.hero{position:relative;padding:22px 2px 8px;display:flex;flex-direction:column;gap:16px;isolation:isolate}
.hero-wave{position:absolute;right:-24px;top:-70px;width:min(520px,70%);height:220px;z-index:-1;pointer-events:none}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.025em}
.hero .sub{font-size:16px;color:var(--fg-2)}
.ask{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--accent-line);border-radius:16px;padding:7px 7px 7px 16px;align-items:center;box-shadow:0 6px 24px rgba(106,69,240,.10)}
.ask .ic{color:var(--accent)}
.ask input{flex:1;border:none;background:transparent;outline:none;padding:10px 0;min-width:0;font-size:15.5px}
.ask.big{max-width:880px;width:100%;align-self:center}
.send{width:48px;height:38px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.quick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.quick button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 15px;cursor:pointer;font-weight:550;box-shadow:var(--shadow);color:var(--fg)}
.quick button .ic{color:var(--accent)}
.quick button:hover{border-color:var(--accent-line)}
.sugg{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg-2)}
.sugg:hover{border-color:var(--accent);color:var(--fg)}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat .si{color:var(--accent);flex:none}
.stat .v{font-family:var(--f-display);font-size:21px;font-weight:800;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--fg-2)}
.stat .d{margin-left:auto;font-size:12px;font-weight:700;align-self:flex-start;white-space:nowrap}
.promo{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,220px);gap:22px;align-items:center;padding:18px 22px;background:linear-gradient(120deg,var(--accent-soft) 0%,var(--surface) 48%)}
.promo .art{display:grid;place-items:center}
.promo h2{font-size:22px;font-weight:800}
.promo .kick{font-size:13px;font-weight:700;color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:9px;border-left:1px solid var(--line);padding-left:20px}
.checks span{display:flex;gap:10px;align-items:center;font-size:13.5px}
.checks .ic{color:var(--good)}
.ms{display:flex;gap:10px;align-items:center}
.ms .ic{color:var(--fg-3)}
.dots{border:none;background:none;cursor:pointer;color:var(--fg-3);padding:4px 6px;border-radius:6px}
.dots:hover{background:var(--sunk);color:var(--fg)}
.proj-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.aic{padding:18px;display:flex;flex-direction:column;gap:14px}
.aic-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aic-h h2{display:flex;gap:10px;align-items:center}
.aic-h h2 .ic{color:var(--accent)}
.model{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:600}
.aic .hi{font-family:var(--f-display);font-size:21px;font-weight:800}
.qcard{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;box-shadow:var(--shadow);color:var(--fg);width:100%}
.qcard .ic{color:var(--accent)}
.qcard:hover{border-color:var(--accent-line)}
.composer{border:1px solid var(--line-strong);border-radius:12px;padding:10px 10px 8px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer input{border:none;outline:none;background:transparent;padding:4px 2px;font-style:italic}
.composer .tools{display:flex;align-items:center;gap:4px}
.composer .tools .tb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.composer .send{margin-left:auto;width:38px;height:34px;border-radius:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:650;color:var(--fg)}
.tile .ic{color:var(--fg)}
.tile:hover,.tile.on{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.on .ic{color:var(--accent)}
.home-chat{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow:auto}

/* Wizard */
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:104px;display:flex;flex-direction:column;gap:6px;padding:0 6px 0 0;cursor:pointer;background:none;border:none;text-align:left}
.step .ln{height:5px;border-radius:3px;background:var(--line)}
.step.done .ln{background:var(--accent)} .step.cur .ln{background:var(--accent-2);opacity:.6}
.step .t{font-size:12px;color:var(--fg-3);font-weight:600}
.step.cur .t,.step.done .t{color:var(--fg)}
.step[disabled]{cursor:default}
.what{font-size:13px;color:var(--fg-2);background:var(--accent-soft);border-radius:10px;padding:9px 13px}
.map-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
.srcf{display:flex;flex-direction:column;gap:6px}
.srcf .chip{cursor:grab;justify-content:space-between;border-radius:8px}
.maprow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.maprow.drop{background:var(--accent-soft)}
.maprow.sugg-row .input{border-style:dashed;border-color:var(--accent-line)}
.maprow:last-child{border-bottom:none}
.why{font-size:12px;color:var(--fg-3)}
.prog{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .15s}

/* Gantt */
.gantt{display:flex;flex-direction:column;gap:0;min-width:640px}

.g-bar{position:absolute;top:3px;height:14px;border-radius:5px;background:var(--line-strong)}
.g-bar.crit{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.g-bar.delay{background:var(--warn)}
.g-win{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--crit)}

/* Assistent */

    const cost = costing(t, qty); const q = { no: nextNo(t, "QT"), customer: c.id, date: t.date, product: "P-E5", qty, discountPct: disc, unitPrice: unit, net: r2(unit * qty), cost, status: disc > 5 ? "zur Freigabe" : "freigegeben", requirements: p.requirements || "" };

  approveQuote(w, t, p, ctx) { need(t, ctx, "approve"); const q = find(t.quotes, "no", p.quoteNo, "Angebot"); if (q.status !== "zur Freigabe") fail("STATUS", `Angebot ${q.no} hat Status „${q.status}“.`); q.status = "freigegeben"; q.approvedBy = ctx.userName; return { text: `Angebot ${q.no} freigegeben` }; },
  createSalesOrder(w, t, p, ctx) {

    if (p.quoteNo) { need(t, ctx, "sell"); const q = find(t.quotes, "no", p.quoteNo, "Angebot"); if (q.status !== "freigegeben") fail("STATUS", `Angebot ${q.no} ist nicht freigegeben.`); qty = q.qty; unit = q.unitPrice; customer = q.customer; quote = q.no; q.status = "beauftragt"; }

    const so = { no: nextNo(t, "SO"), customer, date: t.date, product: "P-E5", qty, unitPrice: unit, net: r2(unit * qty), status: "bestätigt", quote, mrp: null, installHours: 0, accepted: false, giDoc: null, link: p.link || null, extPo: p.extPo || null };

  runMRP(w, t, p, ctx) {

    const needs = E5_BOM.map(([mat, per]) => { const req = per * so.qty, av = avail(t, mat, "WH1"); return { mat, name: materialOf(t, mat).name, required: req, available: av, shortage: Math.max(0, req - av) }; });
    const prod = { no: nextNo(t, "PA"), so: so.no, product: "P-E5", qty: so.qty, status: "eröffnet", components: needs.map(n => ({ mat: n.mat, qty: n.required, issued: 0 })), labor: 0, docs: [], wip: 0 };

  createPOsFromMRP(w, t, p, ctx) {

    const bySup = {}; for (const s of so.mrp.shortages) { const m = materialOf(t, s.mat); (bySup[m.supplier] = bySup[m.supplier] || []).push({ mat: s.mat, qty: s.shortage, price: m.price }); }
    const nos = []; for (const [sup, lines] of Object.entries(bySup)) nos.push(CMD.createPO(w, t, { supplierId: sup, lines, so: so.no }, ctx).objects[0]);

    if (missing.length) fail("AVAILABILITY", `Verfügbarkeitsprüfung: ${missing.map(c => materialOf(t, c.mat).name + " fehlt " + (c.qty - avail(t, c.mat, "WH1"))).join(", ")}.`);
    for (const c of pa.components) stk(t, c.mat, "WH1").res += c.qty;

  /* --- Aventra: Project-to-Cash --- */
  findStaff(w, t, p) {
    const per = periodOf(t.date); const load = {}; for (const pr of t.projects) for (const m of pr.team) load[m.employee] = (load[m.employee] || 0) + m.hoursPerMonth;
    const list = t.master.employees.filter(e => e.skills.includes(p.skill)).map(e => ({ id: e.id, name: e.name, level: e.level, skills: e.skills, costRate: e.costRate, billRate: e.billRate, booked: load[e.id] || 0, absent: absHoursInPeriod(t, e.id, per), free: Math.max(0, e.capacity - (load[e.id] || 0) - absHoursInPeriod(t, e.id, per)) })).sort((a, b) => b.free - a.free);
    return { text: `${list.length} Mitarbeitende mit Skill ${p.skill}`, result: list, period: per };
  },
  createProject(w, t, p, ctx) {
    need(t, ctx, "staff"); const c = find(t.master.customers, "id", p.customerId, "Kunde"); const id = "P-" + (1001 + t.projects.length);
    const pr = { id, name: p.name, customer: c.id, budget: r2(p.budget), planRevenue: r2(p.planRevenue), rate: p.rate || 150, start: periodOf(t.date), etcHours: p.hours || 1000, status: "freigegeben", team: [], live: true };
    t.projects.push(pr); t.co[id] = { cost: 0, revenue: 0, hours: 0, expenses: 0 }; return { text: `Projekt ${id} angelegt, Budget ${pr.budget} €`, objects: [id] };
  },
  assignStaff(w, t, p, ctx) {
    need(t, ctx, "staff"); const pr = find(t.projects, "id", p.projectId, "Projekt"); const load = {}; for (const x of t.projects) for (const m of x.team) load[m.employee] = (load[m.employee] || 0) + m.hoursPerMonth;
    const conflicts = []; for (const eid of p.employeeIds) { const e = find(t.master.employees, "id", eid, "Mitarbeiter"); const cap = e.capacity - absHoursInPeriod(t, eid, periodOf(t.date)); const after = (load[eid] || 0) + p.hoursPerMonth; if (after > cap) conflicts.push(`${e.name}: ${after} h > ${cap} h verfügbar`); }
    if (conflicts.length && !p.force) fail("CAPACITY", "Kapazitätskonflikt: " + conflicts.join("; "));
    for (const eid of p.employeeIds) { const e = t.master.employees.find(x => x.id === eid); pr.team.push({ employee: eid, role: e.skills[0], hoursPerMonth: p.hoursPerMonth }); }
    const cost = r2(p.employeeIds.reduce((a, id) => a + t.master.employees.find(e => e.id === id).costRate * p.hoursPerMonth, 0));
    return { text: `${p.employeeIds.length} Mitarbeitende zugeordnet, geplante Kosten ${cost} € pro Monat` };
  },
  recordTime(w, t, p, ctx) {
    need(t, ctx, "time"); const pr = find(t.projects, "id", p.projectId, "Projekt"); const e = find(t.master.employees, "id", p.employeeId, "Mitarbeiter");
    if (!pr.team.some(m => m.employee === e.id)) fail("NOT_STAFFED", `${e.name} ist dem Projekt ${pr.id} nicht zugeordnet.`);
    const h = Number(p.hours); if (!(h > 0 && h <= 12)) fail("HOURS", "Stunden müssen zwischen 0 und 12 liegen.");
    const te = { id: nextNo(t, "TE"), employee: e.id, project: pr.id, date: t.date, hours: h, billable: p.billable !== false, status: "erfasst", period: periodOf(t.date), costRate: e.costRate, billRate: pr.rate };
    t.timeEntries.push(te); return { text: `${h} h erfasst (Status erfasst) – noch keine Kosten`, objects: [te.id] };
  },
  approveTime(w, t, p, ctx) {
    need(t, ctx, "approve"); const ids = p.ids || t.timeEntries.filter(e => e.status === "erfasst" && (!p.projectId || e.project === p.projectId)).map(e => e.id); if (!ids.length) fail("NONE", "Keine offenen Zeiten.");
    let cost = 0, rev = 0; for (const id of ids) { const e = find(t.timeEntries, "id", id, "Zeitbuchung"); if (e.status !== "erfasst") continue; e.status = "freigegeben"; e.approvedBy = ctx.userName; const c = r2(e.hours * e.costRate); cost += c; if (e.billable) rev += e.hours * e.billRate; const co = t.co[e.project]; co.cost = r2(co.cost + c); co.hours += e.hours; }
    return { text: `${ids.length} Zeitbuchungen freigegeben: Projektkosten +${r2(cost)} €, abrechenbar ${r2(rev)} € (Kostenrechnung)` };
  },
  recordExpense(w, t, p, ctx) {
    need(t, ctx, "time"); const pr = find(t.projects, "id", p.projectId, "Projekt"); const amt = r2(p.amount); if (!(amt > 0)) fail("AMOUNT", "Betrag fehlt.");
    const d = post(t, { date: t.date, text: "Reisekosten " + pr.id + " " + (p.text || ""), user: ctx.userName, ref: { type: "project", id: pr.id }, lines: [{ acct: "6650", dr: amt }, { acct: "1100", cr: amt }] });
    const x = { id: nextNo(t, "RK"), project: pr.id, amount: amt, billable: p.billable !== false, status: "erfasst", docNo: d.no }; t.expenses.push(x); t.co[pr.id].cost = r2(t.co[pr.id].cost + amt); t.co[pr.id].expenses = r2((t.co[pr.id].expenses || 0) + amt);
    return { text: `Reisekosten ${amt} € gebucht und dem Projekt belastet`, docs: [d.no] };
  },
  invoiceProject(w, t, p, ctx) {
    need(t, ctx, "bill"); const pr = find(t.projects, "id", p.projectId, "Projekt"); const te = t.timeEntries.filter(e => e.project === pr.id && e.status === "freigegeben" && e.billable); const ex = t.expenses.filter(e => e.project === pr.id && e.status === "erfasst" && e.billable);
    const net = r2(te.reduce((a, e) => a + e.hours * e.billRate, 0) + ex.reduce((a, e) => a + e.amount, 0)); if (!(net > 0)) fail("NONE", "Keine abrechenbaren, freigegebenen Leistungen.");
    const tax = r2(net * VAT), gross = r2(net + tax), no = "AV-RE-" + periodOf(t.date).replace("-", "") + "-" + pr.id.replace("-", "") + "-" + pad((t.seq["INV" + pr.id] = (t.seq["INV" + pr.id] || 0) + 1), 2);

     <section class="card card-pad" style="display:flex;flex-direction:column;gap:12px"><h3>Resource-to-Project: Berater finden</h3><div class="row"><select class="input" id="skSel" style="max-width:220px" data-on="skill">${["SAP FI/CO", "SAP MM", "SAP SD", "SAP PP", "Projektleitung", "Datenmigration", "Integration", "Architektur"].map(s => `<option ${s === skill ? "selected" : ""}>${s}</option>`).join("")}</select><button class="btn" data-act="findStaff">Verfügbarkeit prüfen</button></div>
      ${staff ? `<div class="tbl-wrap"><table><thead><tr><th></th><th>Name</th><th class="r">gebucht</th><th class="r">frei</th><th class="r">Kostensatz</th></tr></thead><tbody>${staff.slice(0, 8).map(e => `<tr><td><input type="checkbox" class="stc" value="${e.id}" id="st-${e.id}" aria-label="${esc(e.name)} auswählen"></td><td>${esc(e.name)}<div class="small faint">${esc(e.level)} · ${esc(e.skills.join(", "))}</div></td><td class="r num">${e.booked} h</td><td class="r num" style="color:${e.free < 40 ? "var(--crit)" : "inherit"}">${e.free} h</td><td class="r num">${eur(e.costRate)}</td></tr>`).join("")}</tbody></table></div><div class="row"><span class="small">je 40 h/Monat zuordnen zu ${esc(p.id)}</span><button class="btn pri sm" data-act="assign">Zuordnen</button></div>` : `<p class="small muted">Die Suche zeigt freie Kapazität je Mitarbeiter aus allen Projektzuordnungen; eine Überbuchung wird als Konflikt abgelehnt.</p>`}</section></div>`;

/* --- Finance --- */
VIEWS.finance = () => {
  const t = T(); const tab = S.tab.fin || "journal"; const tabs = [["journal", "Journal"], ["tb", "Saldenliste"], ["ar", "Debitoren"], ["ap", "Kreditoren"], ["pl", "GuV je Periode"], ["periods", "Perioden"]];
  let body = "";
  if (tab === "journal") { const docs = t.docs.slice().reverse().slice(0, 40); body = `<section class="card tbl-wrap"><table><thead><tr><th>Beleg</th><th>Datum</th><th>Text</th><th class="r">Betrag</th><th>Benutzer</th></tr></thead><tbody>${docs.map(d => `<tr class="click" data-act="doc" data-no="${d.no}"><td class="mono small">${d.no}</td><td class="num">${dDe(d.date)}</td><td>${esc(d.text)}</td><td class="r num">${eur(d.lines.reduce((a, l) => a + l.dr, 0), 2)}</td><td class="small muted">${esc(d.user)}</td></tr>`).join("")}</tbody></table><p class="small faint" style="padding:10px 14px">${num(t.docs.length)} Belege gesamt, neueste zuerst. Jeder Beleg ist ausgeglichen (Soll = Haben).</p></section>`; }
  if (tab === "tb") { const tb = E.trialBalance(t); const rows = Object.keys(E.COA).filter(a => tb[a]); const sum = rows.reduce((a, x) => a + tb[x], 0); body = `<section class="card tbl-wrap"><table><thead><tr><th>Konto</th><th>Bezeichnung</th><th class="r">Soll-Saldo</th><th class="r">Haben-Saldo</th></tr></thead><tbody>${rows.map(a => `<tr><td class="mono">${a}</td><td>${esc(E.COA[a][0])}</td><td class="r num">${tb[a] > 0 ? eur(tb[a], 2) : ""}</td><td class="r num">${tb[a] < 0 ? eur(-tb[a], 2) : ""}</td></tr>`).join("")}<tr><td></td><td><b>Summe Soll − Haben</b></td><td class="r num" colspan="2"><b>${eur(sum, 2)}</b></td></tr></tbody></table></section>`; }
  if (tab === "ar" || tab === "ap") { const list = (tab === "ar" ? t.custInvoices : t.supInvoices).filter(i => i.open > 0).slice().reverse(); body = `<section class="card tbl-wrap"><table><thead><tr><th>Rechnung</th><th>Partner</th><th>Datum</th><th class="r">Offen</th><th></th></tr></thead><tbody>${list.length ? list.slice(0, 40).map(i => `<tr><td class="mono small">${esc(i.extNo || i.no)}${i.link ? " " + pill("p-acc", "Partner") : ""}</td><td>${esc(tab === "ar" ? E.customerName(t, i.partnerId) : E.supplierName(t, i.partnerId))}</td><td class="num">${dDe(i.date)}</td><td class="r num">${eur(i.open, 2)}</td><td class="r">${tab === "ap" ? `<button class="btn sm" data-act="run" data-cmd="payVendor" data-p='${esc(JSON.stringify({ invoiceNo: i.no }))}'>Bezahlen</button>` : i.link ? '<span class="small faint">Zahlung über Partner-Avis</span>' : `<button class="btn sm" data-act="run" data-cmd="receivePayment" data-p='${esc(JSON.stringify({ invoiceNo: i.no }))}'>Zahlungseingang</button>`}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">Keine offenen Posten.</td></tr>`}</tbody></table><p class="small faint" style="padding:10px 14px">Summe offen ${eur(list.reduce((a, i) => a + i.open, 0), 2)} = Saldo Konto ${tab === "ar" ? "1200" : "1600"} ${eur(Math.abs(E.balance(t, tab === "ar" ? "1200" : "1600")), 2)}</p></section>`; }
  if (tab === "pl") { const ps = E._internal.HIST.concat([E.periodOf(t.date)]).filter((p, i, a) => a.indexOf(p) === i).slice(-7); const pls = ps.map(p => E.plOf(t, p)); body = `<section class="card tbl-wrap"><table><thead><tr><th></th>${ps.map(p => `<th class="r">${perDe(p)}</th>`).join("")}</tr></thead><tbody>${[["revenue", "Umsatz"], ["cogs", "Materialaufwand"], ["grossMargin", "Rohertrag"], ["personnel", "Personal (netto)"], ["other", "Sonstige Kosten"], ["ebit", "EBIT"]].map(([k, l]) => `<tr><td>${k === "ebit" || k === "grossMargin" ? `<b>${l}</b>` : l}</td>${pls.map(x => `<td class="r num">${eur(x[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></section>`; }
  if (tab === "periods") body = `<section class="card tbl-wrap"><table><tbody>${Object.entries(t.periods).slice(-6).map(([p, s]) => `<tr><td>${perDe(p)}</td><td>${pill(s === "open" ? "p-good" : "p-neu", s === "open" ? "offen" : "abgeschlossen")}</td></tr>`).join("")}</tbody></table><div class="row" style="padding:12px 14px;border-top:1px solid var(--line)"><button class="btn" data-act="run" data-cmd="advanceDate" data-p='{"days":7}'>Geschäftsdatum +7 Tage</button><button class="btn pri" data-act="run" data-cmd="closePeriod" data-p='{}'>Monatsabschluss ${perDe(E.periodOf(t.date))}</button><span class="small faint">Abschluss bucht Gehälter, sperrt die Periode und öffnet die nächste.</span></div></section>`;
  return head("Finance · " + esc(T_NAMES[t.id]), "Finanzbuchhaltung") + statusNote("live", "Doppelte Buchführung mit Perioden, Belegnummern und Audit. Buchungen entstehen nur aus Geschäftsvorfällen; Nebenbücher stimmen mit dem Hauptbuch überein.")
   + `<div class="tabs" role="tablist">${tabs.map(x => `<button class="tab ${tab === x[0] ? "on" : ""}" role="tab" data-act="finTab" data-t="${x[0]}">${x[1]}</button>`).join("")}</div>` + body;
};

/* --- Analytics --- */
VIEWS.analytics = () => {
  const t = T(), k = E.kpis(t); const last = E.plOf(t, k.lastClosed), prev = E.plOf(t, E._internal.HIST[E._internal.HIST.indexOf(k.lastClosed) - 1]);
  const br = [["Umsatz", last.revenue - prev.revenue], ["Materialaufwand", -(last.cogs - prev.cogs)], ["Personal", -(last.personnel - prev.personnel)], ["Sonstige", -(last.other - prev.other)]];
  const mx = Math.max(...br.map(b => Math.abs(b[1])), 1);
  let extra = "";
  if (t.id === "aventra") extra = `<section class="card tbl-wrap"><div class="card-h"><h3>Projekte: Budget gegen Prognose</h3></div><table><tbody>${E.projectMetrics(t).map(p => `<tr><td>${esc(p.id)} ${esc(p.name)}</td><td style="width:45%"><div class="bar" style="height:10px"><i style="width:${Math.min(100, p.eac / Math.max(p.eac, p.budget) * 100)}%;background:${p.eac > p.budget ? "var(--crit)" : "var(--accent)"}"></i></div></td><td class="r num small">${pct(p.eac / p.budget * 100)} des Budgets</td></tr>`).join("")}</tbody></table></section>`;
  if (t.id === "novamart") { const top = t.master.articles.map(a => ({ a, rev: a.weekly.slice(-4).reduce((x, y) => x + y, 0) * a.price })).sort((x, y) => y.rev - x.rev).slice(0, 8); extra = `<section class="card tbl-wrap"><div class="card-h"><h3>Top-Artikel letzte 4 Wochen</h3><span class="small faint">Absatz × Preis</span></div><table><tbody>${top.map(x => `<tr><td>${esc(x.a.name)}</td><td class="r num">${eur(x.rev)}</td><td class="r num small">Reichweite ${Math.round(E.avail(t, x.a.id, "ZL1") / Math.max(0.1, x.a.weekly.slice(-4).reduce((p, q) => p + q, 0) / 28))} Tage</td></tr>`).join("")}</tbody></table></section>`; }
  if (t.id === "elevon") extra = `<section class="card card-pad"><h3>Produktion und Auftragsbestand</h3><div class="kv" style="margin-top:8px"><span>Auftragsbestand</span><span class="num">${eur(k.backlog)}</span><span>Offene Fertigungsaufträge</span><span class="num">${k.openProd}</span><span>Unfertige Erzeugnisse</span><span class="num">${eur(k.wip)}</span><span>Materialaufwand ${perDe(k.lastClosed)}</span><span class="num">${eur(last.cogs)} (${pct(last.cogs / last.revenue * 100)} vom Umsatz)</span></div></section>`;
  return head("Analytics · " + esc(T_NAMES[t.id]), "Kennzahlen") + statusNote("live", "Alle Kennzahlen werden bei jedem Aufruf aus Belegen und Nebenbüchern berechnet – keine eingetragenen Dashboard-Zahlen.")
   + `<div class="grid g4">${kpiCard("Umsatz " + perDe(k.lastClosed), eur(k.revenueLast))}${kpiCard("EBIT-Marge " + perDe(k.lastClosed), pct(k.marginLastPct), "Vormonat " + pct(k.marginPrevPct), k.marginLastPct < k.marginPrevPct ? "var(--crit)" : "")}${kpiCard("Offene Forderungen", eur(k.arOpen))}${kpiCard("Bestandswert", eur(k.inventory))}</div>`
   + `<section class="card card-pad">${trendChart(k)}</section>`
   + `<section class="card card-pad"><div class="row between"><h3>EBIT-Brücke ${perDe(prev.period)} → ${perDe(last.period)}</h3><span class="small faint">${eur(prev.ebit)} → ${eur(last.ebit)}</span></div><div class="list" style="margin-top:8px">${br.map(b => `<div class="row" style="flex-wrap:nowrap;padding:5px 0"><span style="width:140px;flex:none" class="small">${b[0]}</span><div style="flex:1;display:grid;grid-template-columns:1fr 1fr;border-left:0"><div style="display:flex;justify-content:flex-end;border-right:1px solid var(--line-strong)">${b[1] < 0 ? `<i style="display:block;height:14px;border-radius:4px 0 0 4px;width:${Math.abs(b[1]) / mx * 100}%;background:var(--crit)"></i>` : ""}</div><div>${b[1] > 0 ? `<i style="display:block;height:14px;border-radius:0 4px 4px 0;width:${b[1] / mx * 100}%;background:var(--good)"></i>` : ""}</div></div><span class="num small" style="width:110px;flex:none;text-align:right">${b[1] >= 0 ? "+" : ""}${eur(b[1])}</span></div>`).join("")}</div><p class="small faint" style="margin-top:6px">Rechts grün = verbessert das EBIT, links rot = verschlechtert es.</p></section>` + extra;
};

/* --- KI-Assistent: regelbasiert, mit Datenbasis und Rechenweg --- */
VIEWS.ai = () => { const ch = S.chat[S.tenant]; return head("AI Assistant · " + esc(T_NAMES[S.tenant]), "KI-Assistent") + statusNote("proto", "Die Antworten werden regelbasiert aus den aktuellen Daten dieses Mandanten berechnet und zeigen Datenbasis, Zeitraum und Rechenweg. Ein Sprachmodell ist in dieser Demo nicht angebunden.")
  + `<section class="card" style="display:flex;flex-direction:column"><div class="ai-body" id="aiBody" style="min-height:320px">${ch.length ? ch.map(m => m.u ? `<div class="msg u">${esc(m.u)}</div>` : `<div class="msg a">${m.a}</div>`).join("") : `<div style="display:flex;flex-direction:column;gap:8px">${AI_SUGG.map(q => `<button class="qcard" data-act="ask" data-q="${esc(q)}">${ic("ai", 18)}<span>${esc(q)}</span></button>`).join("")}</div>`}</div><form class="ai-f" data-form="chat"><div class="composer"><input id="chatIn" placeholder="Frage stellen oder Aufgabe beschreiben …" aria-label="Frage an den KI-Assistenten"><div class="tools"><button class="send" type="submit" aria-label="Senden">${ic("send", 17)}</button></div></div></form></section>`; };
const AI_SUGG = ["Warum ist unsere operative Marge im letzten Monat gesunken?", "Welche Projekte werden voraussichtlich ihre Budgets überschreiten?", "Welche Produkte sollten wir nächste Woche nachbestellen?", "Welche Produktionsaufträge sind gefährdet?", "Welche Lieferanten haben die schlechteste Liefertreue?", "Zeige die offenen Rechnungen von Elevon.", "Erstelle einen Kundenauftrag."];
const basis = (src, per, how) => `<div class="note acc small" style="flex-direction:column;gap:2px"><span><b>Datenbasis:</b> ${src}</span><span><b>Zeitraum:</b> ${per}</span><span><b>Berechnung:</b> ${how}</span></div>`;
function answer(q) {
  const ql = q.toLowerCase(); let tid = S.tenant; let switched = "";
  for (const id of E.TENANT_IDS) if (ql.includes(id) || ql.includes(T_NAMES[id].split(" ")[0].toLowerCase())) { if (id !== tid) { tid = id; S.tenant = id; switched = `<p class="small muted">Kontext gewechselt zu <b>${T_NAMES[id]}</b>.</p>`; } break; }
  const t = W.tenants[tid];
  if (/marge|gewinn|ebit/.test(ql) && /(gesunken|warum|rückgang|gefallen)/.test(ql)) {
    const k = E.kpis(t), a = E.plOf(t, k.lastClosed), b = E.plOf(t, E._internal.HIST[E._internal.HIST.indexOf(k.lastClosed) - 1]);
    const ch = [["Materialaufwand / Wareneinsatz", -(a.cogs - b.cogs), `${pct(b.cogs / b.revenue * 100)} → ${pct(a.cogs / a.revenue * 100)} vom Umsatz`], ["Umsatz", a.revenue - b.revenue, `${eur(b.revenue)} → ${eur(a.revenue)}`], ["Personal (netto)", -(a.personnel - b.personnel), `${eur(b.personnel)} → ${eur(a.personnel)}`], ["Sonstige Kosten", -(a.other - b.other), `${eur(b.other)} → ${eur(a.other)}`]].sort((x, y) => x[1] - y[1]);
    const drv = ch[0]; let why = "";
    if (t.id === "elevon" && drv[0].startsWith("Material")) why = " Die Herstellkosten je Anlage sind gestiegen: Materialaufwand je ausgelieferter Anlage höher als im Vormonat (Preiserhöhung der Komponenten).";
    if (t.id === "novamart") why = " Der Bruttoumsatz je verkauftem Stück sank durch höhere Rabatte, der Wareneinsatz blieb gleich – die Rohertragsquote fiel.";
    if (t.id === "aventra") why = " Weniger abrechenbare Stunden bei gleichen Gehältern: die Auslastung sank, die Personalkosten blieben.";
    return switched + `<p>Die EBIT-Marge fiel von <b>${pct(b.revenue ? b.ebit / b.revenue * 100 : 0)}</b> (${perDe(b.period)}) auf <b>${pct(a.revenue ? a.ebit / a.revenue * 100 : 0)}</b> (${perDe(a.period)}). Größter Treiber: <b>${drv[0]}</b> mit ${eur(drv[1])} EBIT-Wirkung.${why}</p><table><tbody>${ch.map(c => `<tr><td>${c[0]}</td><td class="r num" style="color:${c[1] < 0 ? "var(--crit)" : "var(--good)"}">${c[1] >= 0 ? "+" : ""}${eur(c[1])}</td><td class="small muted">${c[2]}</td></tr>`).join("")}</tbody></table>`
      + basis(`Hauptbuch ${T_NAMES[tid]}, Konten 4000/4400, 5000, 6000/6990, 6300–6855`, `${perDe(b.period)} gegen ${perDe(a.period)} (abgeschlossene Perioden)`, "EBIT = Umsatz − Materialaufwand − Personal (abzüglich verrechneter Fertigungsleistung) − Sonstige; Wirkung je Position = Veränderung mit Vorzeichen fürs EBIT");
  }
  if (/budget/.test(ql)) { if (t.id !== "aventra") return switched + `<p>Projektbudgets werden in dieser Demo bei <b>Aventra Consulting</b> geführt. Frag mit „… von Aventra“, um den Kontext zu wechseln.</p>`;
    const ps = E.projectMetrics(t).sort((a, b) => b.eac / b.budget - a.eac / a.budget); const over = ps.filter(p => p.eac > p.budget);
    return switched + `<p>${over.length ? `<b>${over.length} Projekt${over.length > 1 ? "e" : ""}</b> überschreiten voraussichtlich ihr Budget:` : "Kein Projekt überschreitet voraussichtlich sein Budget. Die engsten:"}</p><table><thead><tr><th>Projekt</th><th class="r">Budget</th><th class="r">Prognose</th><th class="r">Ist</th></tr></thead><tbody>${(over.length ? over : ps.slice(0, 3)).map(p => `<tr><td>${esc(p.id)} ${esc(p.name)}</td><td class="r num">${eur(p.budget)}</td><td class="r num" style="color:${p.eac > p.budget ? "var(--crit)" : "inherit"}">${eur(p.eac)}</td><td class="r num">${eur(p.actualCost)}</td></tr>`).join("")}</tbody></table>`
      + basis("Freigegebene und abgerechnete Zeitbuchungen, Reisekosten, Restaufwand der Projektleitung", "Projektbeginn bis heute plus Restaufwand", "Prognose (EAC) = Ist-Kosten + Reststunden × durchschnittlicher Kostensatz des Teams");
  }
  if (/nachbestell|nachschub|bestellen sollten|meldebestand/.test(ql)) { if (t.id !== "novamart") return switched + `<p>Nachschubvorschläge rechnet die Demo für <b>NovaMart Retail</b>. Frag mit „… bei NovaMart“.</p>`;
    const pr = E.replenishmentProposals(t).slice(0, 8); return switched + `<p>${pr.length} Artikel liegen unter oder am Meldebestand. Vorschlag für die Bestellung:</p><table><thead><tr><th>Artikel</th><th class="r">verfügbar</th><th class="r">Prognose/Woche</th><th class="r">Menge</th></tr></thead><tbody>${pr.map(p => `<tr><td>${esc(p.name)}</td><td class="r num">${p.available}</td><td class="r num">${p.forecastWeek}</td><td class="r num">${p.qty}</td></tr>`).join("")}</tbody></table><div><a class="btn sm" href="#supply">Zu den Vorschlägen</a></div>`
      + basis("Wöchentlicher Absatz je Artikel, Bestand und Reservierungen Zentrallager, offene Bestellungen", "letzte 8 Wochen", "Prognose = Ø 8 Wochen + 2 × Trend; Menge = Prognose × (Lieferzeit + 2 Wochen Reichweite) + Meldebestand − verfügbar");
  }
  if (/produktionsauftr|fertigungsauftr|gefährdet/.test(ql) && !/go-?live/.test(ql)) { if (t.id !== "elevon") return switched + `<p>Fertigung gibt es in dieser Demo bei <b>Elevon Industries</b>.</p>`;
    const open = t.prodOrders.filter(p => p.status !== "abgeschlossen"); if (!open.length) return switched + `<p>Aktuell gibt es keine offenen Fertigungsaufträge. Lege einen Kundenauftrag an und ermittle den Bedarf, dann prüfe ich die Materialverfügbarkeit.</p>`;
    const rows = open.map(p => { const miss = p.components.filter(c => c.issued < c.qty && E.avail(W.tenants.elevon, c.mat, "WH1") + (p.status === "freigegeben" ? c.qty : 0) < c.qty - c.issued); return { p, miss }; });
    return switched + `<table><thead><tr><th>Auftrag</th><th>Status</th><th>Risiko</th></tr></thead><tbody>${rows.map(x => `<tr><td class="mono small">${x.p.no}</td><td>${stPill(x.p.status)}</td><td>${x.miss.length ? `<span style="color:var(--crit)">Fehlteile: ${x.miss.map(c => esc(E.materialOf(t, c.mat).name)).join(", ")}</span>` : "Material verfügbar"}</td></tr>`).join("")}</tbody></table>` + basis("Fertigungsaufträge, Komponentenbedarf aus Stückliste, frei verfügbarer Bestand WH1", "aktueller Stand", "Gefährdet = benötigte Menge größer als verfügbarer Bestand ohne fremde Reservierungen");
  }
  if (/liefertreue|lieferanten/.test(ql)) { if (t.id !== "novamart") return switched + `<p>Liefertreue-Daten liegen in dieser Demo nur bei <b>NovaMart</b> vor. Bei ${T_NAMES[t.id]} ist die Lieferantenbewertung geplant (Welle 2).</p>`;
    const s = t.master.suppliers.filter(x => x.otd).sort((a, b) => a.otd - b.otd).slice(0, 5); return switched + `<table><thead><tr><th>Lieferant</th><th class="r">Liefertreue</th></tr></thead><tbody>${s.map(x => `<tr><td>${esc(x.name)}</td><td class="r num">${pct(x.otd * 100)}</td></tr>`).join("")}</tbody></table>` + basis("Lieferantenstamm, Kennzahl termingerechte Lieferungen", "Seed-Historie 12 Monate", "Anteil termingerechter Wareneingänge; aus Seed übernommen, noch nicht aus Live-Wareneingängen fortgeschrieben (teilweise implementiert)");
  }

function storyPanel() {
  const st = STORIES.find(s => s.id === S.story.id); const i = S.story.i;
  return `<section class="card card-pad story" style="display:flex;flex-direction:column;gap:12px"><div class="row between"><div><p class="eyebrow">Guided Demo · ${i}/${st.steps.length} Schritte</p><h2>${esc(st.title)}</h2></div><button class="btn sm" data-act="endStory">Beenden</button></div>
   ${i === 0 ? `<div class="kv"><span>Ausgangslage</span><span>${esc(st.situation)}</span><span>Problem</span><span>${esc(st.problem)}</span></div>` : ""}
   <div class="stepl">${st.steps.map((s, k) => k < i - 2 || k > i + 2 ? "" : `<div class="si ${k < i ? "done" : k === i ? "cur" : ""}"><span class="no">${k < i ? "✓" : k + 1}</span><div style="flex:1"><b>${esc(s.t)}</b>${s.tenant ? ` ${pill("p-acc", T_NAMES[s.tenant])}` : ""}<div class="small muted">${esc(s.d)}</div></div>${k === i ? `<button class="btn pri sm" data-act="storyStep">${s.ask ? "KI fragen" : "Ausführen"}</button>` : ""}</div>`).join("")}</div>
   ${i >= st.steps.length ? `<div class="note good"><div><b>Geschäftliches Ergebnis:</b> ${esc(st.value)}<br><span class="small">${esc(st.outro)}</span></div></div><div class="row"><button class="btn" data-act="resetStory">Zurücksetzen und erneut vorführen</button></div>` : ""}</section>`;
}
function storyStep() {
  const st = STORIES.find(s => s.id === S.story.id); const s = st.steps[S.story.i]; if (!s) return;
  const tid = s.tenant || st.tenant; if (S.tenant !== tid) S.tenant = tid;
  if (s.user) S.users[tid] = s.user;
  if (s.ask) { S.story.i++; ask(s.ask); return; }
  const c = S.story.ctx; let ok = true;
  if (s.multi) { const list = s.multi(c); if (!list.length && !s.then) { toast("Für diesen Schritt gibt es nichts zu tun – weiter.", false); } for (const [cmd, p] of list) { const r = act(cmd, p, { tenant: tid, user: s.user, auto: true }); if (!r.ok) { ok = false; break; } } if (ok && s.then) s.then(c); }
  else { const r = act(s.cmd, s.p(c), { tenant: tid, user: s.user, auto: true }); ok = r.ok; if (ok && s.save) c[s.save] = r.objects[0]; }
  if (ok) { S.story.i++; saveLog(); }
  render();
}

const BK = { mode: "local", status: "Lokal im Browser", db: null, user: null, canEdit: null, mcp: null, sample: null, events: [], control: [], queue: Promise.resolve(), timer: null, replayT: null };

    const onErr = e => { clearTimeout(BK.timer); BK.mode = "local"; BK.status = "Gemeinsame Datenbank nicht erreichbar (" + e.code + ") – lokal weiter"; render(); };

  }).catch(() => {});
}

  const all = BK.events.map(e => Object.assign({ kind: "event" }, e)).concat(BK.control.map(c => Object.assign({ kind: "control" }, c))).sort((a, b) => a.ts - b.ts);

async function gdRestore(fileId) {
  if (!isAdmin()) return toast("Nur Editoren dürfen wiederherstellen.", true); S.gd = { busy: "Sicherung wird gelesen …" }; render();
  try { const r = await BK.mcp.callTool(GD, "read_file_content", { fileId }); let txt = typeof r.payload === "string" ? r.payload : (r.payload && (r.payload.content || r.payload.text)) || (r.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
    const data = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)); if (!Array.isArray(data.log)) throw { message: "Datei ist keine NEXORA-Sicherung." };

    if (BK.mode === "db") { await BK.db.collection("control").doc().set({ ts: newTs(), resetAll: true, size: data.size || "S", restoredFrom: fileId }); let i = 0; for (const x of data.log) { const base = newTs() + (++i); if (x.kind === "control" || x.reset || x.resetAll) await BK.db.collection("control").doc().set(Object.assign({}, x, { ts: base })); else await BK.db.collection("events").doc().set(Object.assign({}, x, { ts: base })); } }
    else { S.size = data.size || "S"; W = E.createWorld({ size: S.size }); captureBase(); LOG = []; for (const x of data.log) { try { applyLog(x); LOG.push(x); } catch (e) {} } saveLog(); }
    S.gd = { ok: `Wiederhergestellt: ${data.log.length} Ereignisse. Fingerabdrücke werden neu berechnet.` }; S.restoreCheck = data.fingerprints || null;
  } catch (e) { S.gd = { err: e.code ? gdErr(e) : "Wiederherstellung fehlgeschlagen: " + (e.message || "Format nicht lesbar") }; } render();
}

function md(s) {
  const lines = esc(s).split("\n"); let out = "", inList = false, tbl = [];
  const flushT = () => { if (!tbl.length) return; const rows = tbl.filter(r => !/^\s*\|?\s*-{2,}/.test(r)); out += "<table>" + rows.map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|").map(c => (i ? "<td>" : "<th>") + c.trim() + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>"; tbl = []; };
  for (const l of lines) { if (/^\s*\|/.test(l)) { tbl.push(l.trim()); continue; } flushT(); if (/^\s*[-*] /.test(l)) { if (!inList) { out += "<ul style='margin:4px 0;padding-left:18px'>"; inList = true; } out += "<li>" + l.replace(/^\s*[-*] /, "") + "</li>"; continue; } if (inList) { out += "</ul>"; inList = false; } if (l.trim()) out += "<p>" + l + "</p>"; }
  flushT(); if (inList) out += "</ul>"; return out.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^<p>(Datenbasis|Zeitraum|Berechnung):/gm, "<p class='small muted'><b>$1:</b>");
}

/* ---------- Zeichnungsansicht (SVG aus DXF-Geometrie) ---------- */
function geoSheets(geo) { // Blätter = lange waagerechte Rahmenlinien unten (Blattränder)
  const fr = geo.geom.filter(g => g.t === "line" && /RAHMEN/i.test(g.layer) && Math.abs(g.y1 - g.y2) < 0.01 && Math.abs(g.x2 - g.x1) > 300);
  const out = []; for (const g of fr.sort((a, b) => Math.min(a.x1, a.x2) - Math.min(b.x1, b.x2))) { const x = Math.min(g.x1, g.x2), w = Math.abs(g.x2 - g.x1); if (!out.some(o => Math.abs(o[0] - x) < 30 || (x > o[0] && x < o[0] + o[2]))) out.push([x, geo.bbox[1], w, geo.bbox[3] - geo.bbox[1]]); }
  return out.length > 1 ? out : [];
}
function drawingSvg(geo, hiPos, h) {
  if (!geo || !geo.geom) return `<div class="empty small">Keine Geometrie (Zeichnung wurde aus einem Bild erkannt).</div>`;
  const [x0, y0, x1, y1] = geo.bbox; const X = x => (x - x0).toFixed(2), Y = y => (y1 - y).toFixed(2);
  const sheets = geoSheets(geo); const v = S.eng.view;
  let vb = [-5, -5, x1 - x0 + 10, y1 - y0 + 10];
  const posGeo = hiPos ? geo.geom.filter(g => g.layer.toUpperCase() === "POS-" + hiPos) : [];
  if (posGeo.length) { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const g of posGeo) { const pts = g.t === "line" ? [[g.x1, g.y1], [g.x2, g.y2]] : g.t === "poly" ? g.pts : [[g.x - g.r, g.y - g.r], [g.x + g.r, g.y + g.r]]; for (const [px, py] of pts) { a = Math.min(a, px); b = Math.min(b, py); c = Math.max(c, px); d = Math.max(d, py); } } const m = Math.max(c - a, d - b) * 0.25 + 10; vb = [a - x0 - m, y1 - d - m, c - a + 2 * m, d - b + 2 * m]; }
  else if (v != null && sheets[v]) { const [sx, sy, sw, sh] = sheets[v]; vb = [sx - x0 - 3, y1 - (sy + sh) - 3, sw + 6, sh + 6]; }
  const col = l => { l = l.toUpperCase(); if (hiPos && l === "POS-" + hiPos) return "var(--accent)"; if (l.startsWith("POS-")) return "var(--fg)"; if (l === "POSNR") return "var(--crit)"; if (l === "RAHMEN" || l === "STUECKLISTE") return "var(--fg-3)"; if (l === "BEMASSUNG") return "var(--good)"; if (l === "SCHWEISS") return "var(--warn)"; if (l === "MITTELLINIE") return "var(--crit)"; if (l === "SCHRAFFUR" || l === "VERDECKT") return "var(--fg-3)"; return "var(--fg-2)"; };
  const sw = l => { l = l.toUpperCase(); return hiPos && l === "POS-" + hiPos ? 2.6 : l.startsWith("POS-") || l === "ANSICHT" ? 1.1 : .6; };
  const dash = l => { l = l.toUpperCase(); return l === "VERDECKT" ? ' stroke-dasharray="4 2"' : l === "MITTELLINIE" ? ' stroke-dasharray="10 2 2 2"' : ""; };
  const el = geo.geom.map(g => {
    const a = `stroke="${col(g.layer)}" stroke-width="${sw(g.layer)}"${dash(g.layer)} fill="none" vector-effect="non-scaling-stroke"`;
    if (g.t === "line") return `<line x1="${X(g.x1)}" y1="${Y(g.y1)}" x2="${X(g.x2)}" y2="${Y(g.y2)}" ${a}/>`;
    if (g.t === "circle") return `<circle cx="${X(g.x)}" cy="${Y(g.y)}" r="${g.r}" ${a}/>`;
    if (g.t === "arc") { const r1 = g.a1 * Math.PI / 180, r2 = g.a2 * Math.PI / 180; const sweep = ((g.a2 - g.a1) % 360 + 360) % 360; return `<path d="M${X(g.x + g.r * Math.cos(r1))} ${Y(g.y + g.r * Math.sin(r1))} A${g.r} ${g.r} 0 ${sweep > 180 ? 1 : 0} 0 ${X(g.x + g.r * Math.cos(r2))} ${Y(g.y + g.r * Math.sin(r2))}" ${a}/>`; }
    return `<polyline points="${g.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}${g.closed ? " " + X(g.pts[0][0]) + "," + Y(g.pts[0][1]) : ""}" ${a}/>`;
  }).join("");
  const tx = (geo.texts || []).filter(t => t.s).map(t => `<text x="${X(t.x)}" y="${Y(t.y)}" font-size="${t.h}" fill="${col(t.layer)}" style="font-family:var(--f-body)">${esc(t.s)}</text>`).join("");
  const bar = `<div class="row" style="gap:6px;margin-bottom:6px">${sheets.length ? `<div class="seg">${[["", "Gesamt"]].concat(sheets.map((_, i) => [String(i), "Blatt " + (i + 1)])).map(([k, l]) => `<button class="${String(v == null ? "" : v) === k && !posGeo.length ? "on" : ""}" data-act="dwgView" data-v="${k}">${l}</button>`).join("")}</div>` : ""}${posGeo.length ? `<span class="small muted">Abwicklung Pos. ${esc(hiPos)} · Schnittkontur hervorgehoben</span><button class="btn sm" data-act="hiPos" data-pos="${esc(hiPos)}">Zurück</button>` : `<span class="small faint">Position in der Tabelle anklicken, um die Abwicklung zu zeigen</span>`}</div>`;
  return bar + `<svg viewBox="${vb.map(n => n.toFixed(1)).join(" ")}" style="width:100%;height:${h || 380}px;background:var(--surface);border:1px solid var(--line);border-radius:10px" role="img" aria-label="Zeichnungsansicht">${el}${tx}</svg>`;
}

async function readDrawingFile(file) {

  let lim = null; try { lim = await BK.sample.limits(); } catch (e) {}
  if (!lim || !lim.images) { S.eng.err = "In dieser Ansicht können keine Bilder an Claude gesendet werden – bitte DXF verwenden."; render(); return; }

  try { const j = await BK.sample.json(prompt, { images: [file], modelTier: "complex" }); const unsure = Array.isArray(j.unsure) ? j.unsure : [];
    S.eng.preview = { kind: "KI", drawing: Object.assign({ source: "Bild (KI-Erkennung)", file: name, aiAssisted: true }, j, { items: (j.items || []).map(i => Object.assign({}, i, { qty: +i.qty || 0 })) }), geometry: null, warnings: ["Von Claude aus dem Bild erkannt – jede Position prüfen, bevor sie übernommen wird."].concat(unsure.map(u => "Unsicher: " + u)) }; }
  catch (e) { S.eng.err = { not_granted: "Claude ist für diese Seite nicht freigegeben.", images_unavailable: "Bilder können in dieser Ansicht nicht gesendet werden.", image_rejected: "Das Bild wurde nicht angenommen (Typ oder Größe).", invalid_json: "Claude hat keine auswertbare Stückliste geliefert – bitte schärferes Bild oder DXF verwenden.", rate_limited: "Zu viele Anfragen – gleich erneut versuchen." }[e.code] || ("Claude konnte die Zeichnung nicht lesen (" + (e.code || e.message) + ")."); }

}

function asmNext(t, p) {
  if (p.status === "abgeschlossen") return null;
  if (!p.mrp) return { label: "Bedarfsplanung", cmd: "planAssemblyOrder", p: { prodNo: p.no } };
  const reqs = t.reqs.filter(r => r.prod === p.no); if (reqs.some(r => !r.po)) return { label: "Bestellungen erzeugen", cmd: "convertRequisitions", p: { reqNos: reqs.filter(r => !r.po).map(r => r.no) } };
  const pos = [...new Set(reqs.map(r => r.po))].map(no => t.purchaseOrders.find(x => x.no === no)).filter(po => po && po.kind !== "Lohnbearbeitung");
  const open = pos.find(po => !po.grDoc); if (open) return { label: "Wareneingang " + open.no, cmd: "postGoodsReceipt", p: { poNo: open.no } };
  if (p.status === "eröffnet") return { label: "Freigeben (Verfügbarkeit)", cmd: "releaseProdOrder", p: { prodNo: p.no } };
  const cur = p.ops.find(o => o.status !== "erledigt");
  if (!cur) return { label: "Abliefern ins Lager", cmd: "completeAssemblyOrder", p: { prodNo: p.no } };
  if (cur.external) { if (cur.status === "bereit zum Versand" || cur.status === "offen") return { label: "An Lohnbearbeiter versenden", cmd: "shipToSubcontractor", p: { prodNo: p.no } }; const q = reqs.find(r => r.op === cur.no); return q && q.po ? { label: "Wareneingang Lohnbearbeitung", cmd: "postGoodsReceipt", p: { poNo: q.po } } : null; }
  return { label: `Rückmelden ${cur.no} ${cur.wcName}`, cmd: "confirmOperation", p: { prodNo: p.no } };
}

const NEXORA_MASK = { so: "sales", po: "supply", req: "supply", doc: "finance", cust: "sales", mat: "supply", inbox: "inbox", task: "tasks" };
VIEWS.obj = () => {

ACT.goBack = () => history.back(); ACT.goMask = d => { if (d.r === "supply") S.tab.sup = "req"; go(d.r); };
// Suche (⌘K) im Layer-Modus: alle Konnektoren, Treffer als Kartenvorschau, gruppiert nach System

openPalette = function () {

// Fehlerbehebung: Schaltflächen in Dialogen (Suche, Bestätigung, Demo vorbereiten) erreichten den Klick-Handler nicht,

const _taskCount8 = taskCount; taskCount = () => S.layer === "layer" ? C.listTasks(W, S.tenant, { user: S.users[S.tenant] }).length : _taskCount8();

/* ---------- Phase 3: Aktionskarten im Assistenten ----------

   und Bestätigungsdialog, über act() → connector.dispatch() mit Rechteprüfung. */
const AI_CARD_MAX = 8;
const cardDesc = k => ({ ref: k.ref, system: k.source, simuliert: !!(C.CONNECTORS[k.sys] && C.CONNECTORS[k.sys].simulated), zugriffsweg: k.route, prozess: (C.PROCESSES[k.process] || {}).label || null, titel: k.title, status: k.status || null, faellig: k.due || null, felder: Object.fromEntries((k.fields || []).map(([a, b]) => [a, b])), aktionen: (k.actions || []).map(a => a.label + (a.fourEyes ? " (Vier-Augen)" : "")) });
const aiNote = refs => { S.aiRefs = S.aiRefs || []; for (const r of refs) if (!S.aiRefs.includes(r)) S.aiRefs.push(r); };
function aiTasks(sys) { const l = layerTasks().filter(k => !sys || k.sys === sys || (C.CONNECTORS[k.sys] || {}).name.toLowerCase().includes(String(sys).toLowerCase())); return l; }
function aiSearch(q) { const hits = C.search(W, S.tenant, q, { user: S.users[S.tenant] }); const open = new Map(layerTasks().map(k => [k.ref, k])); return hits.map(h => ({ hit: h, task: open.get(h.ref) || null })); }
function aiCosts() { const d = T().date; const today = C.costs(W, S.tenant, { date: d }), month = C.costs(W, S.tenant, { period: d.slice(0, 7) }); return { heute: today, monat: month, datum: d }; }
const _aiTools8 = AI_TOOLS;
AI_TOOLS = () => S.layer !== "layer" ? _aiTools8() : _aiTools8().concat([
  { name: "aufgaben_alle", description: "Offene Aufgaben der angemeldeten Person aus allen Systemen (NEXORA-Engine live; SAP S/4HANA, Microsoft 365, ServiceNow, Workday als simulierte Demo-Konnektoren). Liefert je Aufgabe eine Kartenbeschreibung mit ref, System, Zugriffsweg, Feldern und möglichen Aktionen. Optional nach System filtern (nexora, sap, m365, servicenow, workday).", inputSchema: { type: "object", properties: { system: { type: "string" } } },
    execute: i => { const l = aiTasks(i && i.system); aiNote(l.slice(0, AI_CARD_MAX).map(k => k.ref)); return { datum: T().date, person: U().name, anzahl: l.length, karten: l.slice(0, 20).map(cardDesc) }; } },
  { name: "suche_alle", description: "Volltextsuche über alle Systeme (Bestellanforderungen, Rechnungen, Mails, Tickets, Abwesenheiten, Belege, Aufträge, Kunden, Material). Liefert Treffer mit ref; offene Aufgaben zusätzlich als Kartenbeschreibung.", inputSchema: { type: "object", properties: { q: { type: "string" } }, required: ["q"] },
    execute: i => { const r = aiSearch(String(i.q || "")); aiNote(r.filter(x => x.task).slice(0, AI_CARD_MAX).map(x => x.task.ref)); return r.slice(0, 25).map(x => x.task ? cardDesc(x.task) : { ref: x.hit.ref, system: x.hit.source, simuliert: x.hit.simulated, art: x.hit.kind, titel: x.hit.title, info: x.hit.sub }); } },
  { name: "objekt", description: "Details eines Objekts per ref (z. B. sap:pr:10004711, servicenow:ritm:RITM0014021): Felder, Verlauf und – falls offen – die Kartenbeschreibung mit Aktionen.", inputSchema: { type: "object", properties: { ref: { type: "string" } }, required: ["ref"] },
    execute: i => { const o = C.getObject(W, S.tenant, String(i.ref)); if (!o) throw new Error("Objekt nicht gefunden"); const k = layerTasks().find(x => x.ref === o.ref || x.ref === String(i.ref)); if (k) aiNote([k.ref]); return { ref: String(i.ref), system: o.source, simuliert: o.simulated, titel: o.title, felder: Object.fromEntries(o.fields), verlauf: o.history || [], karte: k ? cardDesc(k) : null }; } },
  { name: "kosten", description: "Kosten der protokollierten Zugriffe (Aktionen und Agentenabfragen) je System und Zugriffsweg, für heute und den laufenden Monat. Beispielwerte, keine Herstellerpreise.", execute: () => aiCosts() }
]);
const AI_RULES_LAYER = () => `
Experience Layer: Du siehst Aufgaben aus allen Systemen über die Werkzeuge aufgaben_alle, suche_alle, objekt und kosten. Alle Systeme außer der NEXORA-Engine sind simulierte Demo-Konnektoren ohne echte Integration – sage das, wenn du sie nennst. Du führst nichts aus: Unter deiner Antwort zeigt die Oberfläche automatisch Aktionskarten zu den Aufgaben, die deine Werkzeuge geliefert haben; die Person bestätigt jede Aktion selbst. Nenne bei jeder Aufgabe System, Referenz und deine Empfehlung (freigeben, ablehnen, klären) mit kurzer Begründung. Kosten sind Beispielwerte, keine Herstellerpreise.`;
const _askClaude8 = askClaude;
askClaude = async function (q) {
  if (S.layer !== "layer") return _askClaude8(q);
  // AI_RULES ist eine Konstante: Layer-Regeln werden an die erste Nachricht des Aufrufs angehängt
  const smp = BK.sample; S.aiRefs = [];
  if (smp) BK.sample = (turns, o) => smp([Object.assign({}, turns[0], { content: turns[0].content + AI_RULES_LAYER() })].concat(turns.slice(1)), o);
  try { await _askClaude8(q); } finally { if (smp) BK.sample = smp; } const ch = S.chat[S.tenant]; const slot = ch[ch.length - 1];
  if (slot && S.aiRefs.length) { slot.cards = S.aiRefs.slice(0, AI_CARD_MAX); render(); } S.aiRefs = [];
};
// Regel-Rückfall: dieselben Karten, ohne Sprachmodell
const AI_CARD_MARK = /<!--cards:([^>]*)-->/;
const cardsMark = refs => refs.length ? `<!--cards:${refs.slice(0, AI_CARD_MAX).join(",")}-->` : "";
const _answer8 = answer;
answer = function (q) {
  if (S.layer !== "layer") return _answer8(q);
  const ql = q.toLowerCase(); const t = T(), d = t.date;
  if (/(freigeben|freigabe|genehmig|aufgaben|zu tun|inbox|erledigen)/.test(ql) && !/(marge|budget|nachbestell|projekt)/.test(ql)) {
    const l = layerTasks(); const due = l.filter(k => !k.due || k.due <= d); const by = {}; for (const k of l) by[k.source] = (by[k.source] || 0) + 1;
    if (!l.length) return `<p>Für <b>${esc(U().name)}</b> liegen in keinem System offene Aufgaben vor.</p>` + basis("Alle angebundenen Systeme (NEXORA live, übrige simuliert)", "Stand " + dDe(d), "Offene Aufgaben mit Aktion für die Rolle " + esc((R() || {}).name || ""));
    return `<p><b>${l.length} offene Aufgaben</b> für ${esc(U().name)}, davon <b>${due.length}</b> heute fällig oder überfällig. ${Object.entries(by).map(([s, n]) => `${esc(s)}: ${n}`).join(" · ")}.</p><p class="small muted">Ich schlage nur vor – jede Aktion bestätigst du selbst im Dialog. Systeme außer der NEXORA-Engine sind simulierte Demo-Konnektoren.</p>`
      + cardsMark(l.map(k => k.ref)) + basis("Inbox des Experience Layers über alle Konnektoren", "Stand " + dDe(d), "Aufgaben mit offener Aktion für die Rolle " + esc((R() || {}).name || "") + ", sortiert nach Fälligkeit und Betrag");
  }
  if (/(zugriffskosten|ki-kosten|agentenkosten|kosten (heute|diesen monat|im monat|des layers)|was (hat|haben) .*gekostet|kosten der (zugriffe|agenten|aufrufe))/.test(ql)) {

    return `<p>Protokollierte Zugriffe kosten heute <b>${eur4(c.heute.total)}</b>, im laufenden Monat <b>${eur4(c.monat.total)}</b>.</p>` + (rows.length ? `<table><thead><tr><th>System · Zugriffsweg</th><th class="r">Aufrufe</th><th class="r">Kosten</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.system)} · ${esc(r.route)}</td><td class="r num">${r.calls}</td><td class="r num">${eur4(r.cost)}</td></tr>`).join("")}</tbody></table>` : `<p class="small muted">Noch keine protokollierten Zugriffe in diesem Monat.</p>`)
      + basis("Protokoll der Konnektor-Aufrufe", "Heute (" + dDe(c.datum) + ") und " + perDe(c.datum.slice(0, 7)), "Summe der Beispielkosten je Aufruf; Lesen der Inbox ist kostenfrei. " + C.COST_NOTE);
  }

    return `<p>${r.length} Treffer für „${esc(sm[1])}“.</p><div class="list">${r.filter(x => !x.task).slice(0, 8).map(x => `<div class="li" style="padding:6px 0"><span class="grow small"><b>${esc(x.hit.title)}</b> <span class="faint">${esc(x.hit.source)} · ${esc(x.hit.kind)}</span></span><button class="btn sm ghost" data-act="openObj" data-ref="${esc(x.hit.ref)}">Öffnen →</button></div>`).join("")}</div>`
      + cardsMark(r.filter(x => x.task).map(x => x.task.ref)) + basis("Suche über alle Konnektoren", "Stand " + dDe(d), "Textsuche in Nummer, Bezeichnung und Person");
  }

};
function aiCardsHtml(refs) {
  const open = new Map(layerTasks().map(k => [k.ref, k]));
  return `<div class="ly-grid ai-cards">${refs.map(r => { const k = open.get(r); if (k) return cardHtml(k, { ai: true }); const o = C.getObject(W, S.tenant, r);
    return `<article class="ly-card card done"><div class="ly-src"><span class="ly-chip s-${esc(C.parseRef(r).sys)}">${esc(o ? o.source : r)}</span></div><h3>${esc(o ? o.title : r)}</h3><span class="small muted">Nicht mehr offen – bereits bearbeitet.</span><div class="row ly-acts"><button class="btn sm ghost" data-act="openObj" data-ref="${esc(r)}">Öffnen →</button></div></article>`; }).join("")}</div>`;
}
const _aiView8 = VIEWS.ai;
VIEWS.ai = () => {
  if (S.layer !== "layer") return _aiView8();
  const ch = S.chat[S.tenant]; const saved = ch.map(m => m.a);
  for (const m of ch) { if (m.u) continue; let refs = m.cards || null; const mk = !refs && m.a && m.a.match(AI_CARD_MARK); if (mk) refs = mk[1].split(",").filter(Boolean);
    if (refs && refs.length) m.a = mk ? m.a.replace(AI_CARD_MARK, aiCardsHtml(refs)) : m.a + aiCardsHtml(refs); }

};
